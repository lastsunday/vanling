      cache: false
      runInCI: false

  flash-probe-camera-s3:
    script: |
      espflash flash --chip esp32s3 -a watchdog-reset ${IOT_PORT:+--port $IOT_PORT} target/xtensa-esp32s3-none-elf/release/camera-probe
    deps:
      - ~:probe-camera-s3
    options:
      persistent: true
      cache: false
      runInCI: false

  probe-demand-s3:
    script: |
      bash ../../scripts/iot-xtensa.sh build --release -p iot-app --bin demand-probe \
        --target xtensa-esp32s3-none-elf \
        -Z build-std=core,alloc \
        --no-default-features --features lckfb-szpi-esp32s3,console-auto
    inputs:
      - '@group(build-inputs)'
    outputs:
      - 'target/xtensa-esp32s3-none-elf/release/demand-probe'
    options:
      runInCI: false

  flash-probe-multicore-s3:
    script: |
      espflash flash --chip esp32s3 -a watchdog-reset ${IOT_PORT:+--port $IOT_PORT} target/xtensa-esp32s3-none-elf/release/multicore-s3
    deps:
      - ~:probe-multicore-s3
    options:
      persistent: true
      cache: false
      runInCI: false

  flash-s3-thrift:
    script: |
      espflash flash --chip esp32s3 \
        --flash-size 16mb \
        --partition-table partitions/lckfb-szpi-esp32s3.csv \
        -a watchdog-reset \
        ${IOT_PORT:+--port $IOT_PORT} \
        target/xtensa-esp32s3-none-elf/release/vanling-thrift
    deps:
      - ~:build-s3-thrift
    options:
      persistent: true
      cache: false
      runInCI: false

  flash-probe-demand-s3:
    script: |
      espflash flash --chip esp32s3 -a watchdog-reset ${IOT_PORT:+--port $IOT_PORT} target/xtensa-esp32s3-none-elf/release/demand-probe
    deps:
      - ~:probe-demand-s3
    options:
      persistent: true
      cache: false
      runInCI: false

  image:
    script: 'bash ../../scripts/iot-image.sh'
    deps:
      - ~:image-c6
      - ~:image-s3
    options:
      cache: false
      runInCI: false

  image-c6:
    script: 'bash ../../scripts/iot-image.sh esp32c6-devkitc-1'
    deps:
      - ~:build
    options:
      cache: false
      runInCI: false

  image-s3:
    script: 'bash ../../scripts/iot-image.sh lckfb-szpi-esp32s3'
    deps:
      - ~:build-s3
    options:
      cache: false
      runInCI: false

  # C6 emulator smoke: builds with the esp-println UART console (esp-emu only
  # scans UART0; see docs/content/development/iot/emulation.md) and boots the
  # merged image through esp-emu, asserting `[IOT] boot complete`.
  build-c6-emu:
    script: 'bash ../../scripts/iot-emu-image.sh'
    outputs:
      - 'target/emu/riscv32imac-unknown-none-elf/release/vanling'
    deps:
      - ~:check
    options:
      cache: false

  emu-smoke:
    script: 'bash ../../scripts/iot-emu.sh'
    deps:
      - ~:build-c6-emu
    options:
      cache: false
