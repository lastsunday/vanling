language: 'rust'
tags: ['iot']

env:
  CARGO_ESP_TARGET: 'riscv32imac-unknown-none-elf'

tasks:
  bump:
    script: |
      bash ../../scripts/bump.sh \
        "vanling-iot" \
        "Cargo.toml" \
        "apps/iot/**"
    options:
      runInCI: false

  format:
    command: 'cargo fmt --check'

  check:
    command: 'cargo check -p iot-app --bin vanling --target $CARGO_ESP_TARGET'
    inputs:
      - '$CARGO_ESP_TARGET'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'moon.yml'
      - '.cargo/config.toml'
      - 'crates/**/*.rs'
      - 'crates/**/Cargo.toml'
    deps:
      - ~:format

  build:
    command: 'cargo build --release -p iot-app --bin vanling --target $CARGO_ESP_TARGET'
    inputs:
      - '$CARGO_ESP_TARGET'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'moon.yml'
      - '.cargo/config.toml'
      - 'crates/**/*.rs'
      - 'crates/**/Cargo.toml'
    outputs:
      - 'target/$CARGO_ESP_TARGET/release/vanling'
    deps:
      - ~:check

  test:
    command: 'cargo test -p iot-core'
    deps:
      - ~:check

  test-bsp:
    command: >-
      cargo test -p iot-bsp-esp --no-default-features
      --features qmi8658,pca9557
    deps:
      - ~:check

  lint:
    command: 'cargo clippy -p iot-app --bin vanling --target $CARGO_ESP_TARGET -- -D warnings'
    inputs:
      - '$CARGO_ESP_TARGET'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'moon.yml'
      - '.cargo/config.toml'
      - 'crates/**/*.rs'
      - 'crates/**/Cargo.toml'
    deps:
      - ~:check

  lint-host:
    command: 'cargo clippy -p iot-core --all-targets -- -D warnings'
    deps:
      - ~:check

  lint-smoke:
    command: >-
      cargo clippy -p iot-app --bin host-smoke
      --no-default-features --features host -- -D warnings

  check-host:
    command: >-
      cargo check -p iot-app --bin host-smoke
      --no-default-features --features host

  smoke-host:
    command: >-
      cargo run --quiet -p iot-app --bin host-smoke
      --no-default-features --features host
    deps:
      - ~:check-host
    options:
      cache: false

  flash:
    command: 'cargo run -p iot-app --release --target $CARGO_ESP_TARGET'
    deps:
      - ~:build
    options:
      persistent: true
      cache: false
      runInCI: false

  check-c6:
    command: 'cargo check -p iot-app --bin vanling --target $CARGO_ESP_TARGET'
    inputs:
      - '$CARGO_ESP_TARGET'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'moon.yml'
      - '.cargo/config.toml'
      - 'crates/**/*.rs'
      - 'crates/**/Cargo.toml'
    env:
      CARGO_ESP_TARGET: 'riscv32imac-unknown-none-elf'

  build-c6:
    command: 'cargo build --release -p iot-app --bin vanling --target $CARGO_ESP_TARGET'
    inputs:
      - '$CARGO_ESP_TARGET'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'moon.yml'
      - '.cargo/config.toml'
      - 'crates/**/*.rs'
      - 'crates/**/Cargo.toml'
    outputs:
      - 'target/$CARGO_ESP_TARGET/release/vanling'
    env:
      CARGO_ESP_TARGET: 'riscv32imac-unknown-none-elf'
    deps:
      - ~:check-c6

  # s3 (xtensa-esp32s3): dispatched by scripts/iot-xtensa.sh. Uses the espup
  # "esp" toolchain natively (pinned to 1.95.0.0) when fully installed
  # (CI/release); otherwise falls back to the espressif/idf-rust:esp32s3_1.95.0.0
  # container (macOS Intel, where esp-rs stopped shipping toolchains at v1.91+).
  # The esp nightly fork ships no prebuilt Xtensa rust-std, hence -Z build-std.
  check-s3:
    script: |
      bash ../../scripts/iot-xtensa.sh check -p iot-app --bin vanling \
        --target xtensa-esp32s3-none-elf \
        -Z build-std=core,alloc \
        --no-default-features --features lckfb-szpi-esp32s3,console-auto

  build-s3:
    script: |
      bash ../../scripts/iot-xtensa.sh build --release -p iot-app --bin vanling \
        --target xtensa-esp32s3-none-elf \
        -Z build-std=core,alloc \
        --no-default-features --features lckfb-szpi-esp32s3,console-auto
    outputs:
      - 'target/xtensa-esp32s3-none-elf/release/vanling'
    deps:
      - ~:check-s3
    options:
      runInCI: false

  flash-s3:
    command: 'espflash flash --chip esp32s3 target/xtensa-esp32s3-none-elf/release/vanling'
    deps:
      - ~:build-s3
    options:
      persistent: true
      cache: false
      runInCI: false

  image:
    script: 'bash ../../scripts/iot-image.sh'
    deps:
      - ~:image-c6
      - ~:image-s3
    options:
      cache: false
      runInCI: false

  image-c6:
    script: 'bash ../../scripts/iot-image.sh esp32c6-devkitc-1'
    deps:
      - ~:build-c6
    options:
      cache: false
      runInCI: false

  image-s3:
    script: 'bash ../../scripts/iot-image.sh lckfb-szpi-esp32s3'
    deps:
      - ~:build-s3
    options:
      cache: false
      runInCI: false

  # C6 emulator smoke: builds with the esp-println UART console (esp-emu only
  # scans UART0; see docs/content/development/iot/emulation.md) and boots the
  # merged image through esp-emu, asserting `[IOT] boot ok`.
  build-c6-emu:
    script: 'bash ../../scripts/iot-emu-image.sh'
    outputs:
      - 'target/emu/riscv32imac-unknown-none-elf/release/vanling'
    deps:
      - ~:check
    options:
      cache: false

  emu-smoke:
    script: 'bash ../../scripts/iot-emu.sh'
    deps:
      - ~:build-c6-emu
    options:
      cache: false
