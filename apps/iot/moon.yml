language: 'rust'
tags: ['iot']

env:
  CARGO_ESP_TARGET: 'riscv32imac-unknown-none-elf'

tasks:
  bump:
    script: |
      bash ../../scripts/bump.sh \
        "vanling-iot" \
        "Cargo.toml" \
        "apps/iot/**"
    options:
      runInCI: false

  format:
    command: 'cargo fmt --check'

  check:
    command: 'cargo check -p iot-app --bin vanling --target $CARGO_ESP_TARGET'
    inputs:
      - '$CARGO_ESP_TARGET'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'moon.yml'
      - '.cargo/config.toml'
      - 'crates/**/*.rs'
      - 'crates/**/Cargo.toml'
    deps:
      - ~:format

  build:
    command: 'cargo build --release -p iot-app --bin vanling --target $CARGO_ESP_TARGET'
    inputs:
      - '$CARGO_ESP_TARGET'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'moon.yml'
      - '.cargo/config.toml'
      - 'crates/**/*.rs'
      - 'crates/**/Cargo.toml'
    outputs:
      - 'target/$CARGO_ESP_TARGET/release/vanling'
    deps:
      - ~:check

  # `iot-app`'s own tests run on the host backend rather than bare metal: the
  # demand publisher is a task-boundary concern rather than a chip one, and
  # `--lib` keeps the `vanling` bin out of it, since that one needs a board.
  test:
    script: 'cargo test -p iot-core && cargo test -p iot-app --lib --no-default-features --features host'
    deps:
      - ~:check

  test-bsp:
    command: >-
      cargo test -p iot-bsp-esp --no-default-features
      --features qmi8658,pca9557,es7210,es8311,gc2145
    deps:
      - ~:check

  # The sound catalogue's files are build products of a table that lives in
  # `iot-tool`, so nothing else in the workspace holds them to it.
  test-tool:
    command: 'cargo test -p iot-tool'

  # Rebuild `assets/*.mid` from the recipes. Writes the source tree, and running
  # it in CI would paper over exactly the failure `test-tool` exists to catch.
  gen-midi-assets:
    command: 'cargo run --quiet -p iot-tool -- midi'
    options:
      cache: false
      runInCI: false

  # Every component feature compiled on its own, which is what features.md rule 5
  # asks for and what no other task here checks: a board feature is by
  # construction the union of what that board wires, so a component reaching for a
  # part it does not name stays invisible until the day a board wires one and not
  # the other.
  check-features:
    script: 'bash ../../scripts/iot-feature-check.sh'
    options:
      cache: false

  lint:
    command: 'cargo clippy -p iot-app --bin vanling --target $CARGO_ESP_TARGET -- -D warnings'
    inputs:
      - '$CARGO_ESP_TARGET'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'moon.yml'
      - '.cargo/config.toml'
      - 'crates/**/*.rs'
      - 'crates/**/Cargo.toml'
    deps:
      - ~:check

  lint-host:
    command: 'cargo clippy -p iot-core --all-targets -- -D warnings'
    deps:
      - ~:check

  lint-smoke:
    command: >-
      cargo clippy -p iot-app --bin host-smoke
      --no-default-features --features host -- -D warnings

  check-host:
    command: >-
      cargo check -p iot-app --bin host-smoke
      --no-default-features --features host

  smoke-host:
    command: >-
      cargo run --quiet -p iot-app --bin host-smoke
      --no-default-features --features host
    deps:
      - ~:check-host
    options:
      cache: false

  flash:
    command: 'cargo run -p iot-app --release --target $CARGO_ESP_TARGET'
    deps:
      - ~:build
    options:
      persistent: true
      cache: false
      runInCI: false

  # s3 (xtensa-esp32s3): dispatched by scripts/iot-xtensa.sh. Uses the espup
  # "esp" toolchain natively (pinned to 1.95.0.0) when fully installed
  # (CI/release); otherwise falls back to the espressif/idf-rust:esp32s3_1.95.0.0
  # container (macOS Intel, where esp-rs stopped shipping toolchains at v1.91+).
  # The esp nightly fork ships no prebuilt Xtensa rust-std, hence -Z build-std.
  # Names every bin so each probe is type-checked on every run. Only `vanling` is
  # linked by `build-s3`, but a probe nothing compiles can rot in place: each one
  # calls a bring-up or a chip API of its own, and a change to `Board`, `Speaker` or
  # the chip layer would leave it failing to build with nobody noticing until the
  # day it is needed on a bench.
  #
  # `wifi-probe` is named on its own rather than through the board feature: it
  # needs the radio and its heap, which the board feature does carry, but it is
  # also the one bin whose `required-features` are the `wifi` feature, so naming
  # the bin is what keeps that feature reachable from here. Both checks name it,
  # because the probe is the one image that has to build on both parts.
  #
  # One invocation, because `camera` is in the board feature: the board mounts the
  # sensor, so every image of this board pays for the 150 KB frame arena the panel's
  # DMA shares. `check-s3` does not link, so nothing here sees the memory that costs —
  # `build-s3` / `image-s3` do, and that is the step that would fail on it.
  check-s3:
    script: |
      bash ../../scripts/iot-xtensa.sh check -p iot-app \
        --bin vanling --bin audio-probe --bin camera-probe --bin multicore-s3 \
        --bin demand-probe --bin aec-probe --bin clock-probe --bin echo-probe \
        --bin wifi-probe \
        --target xtensa-esp32s3-none-elf \
        -Z build-std=core,alloc \
        --no-default-features --features lckfb-szpi-esp32s3,console-auto

  check-c6:
    script: |
      bash ../../scripts/iot-xtensa.sh check -p iot-app \
        --bin vanling --bin wifi-probe \
        --target riscv32imac-unknown-none-elf \
        -Z build-std=core,alloc \
        --no-default-features --features esp32c6-devkitc-1,console-auto

  build-s3:
    script: |
      bash ../../scripts/iot-xtensa.sh build --release -p iot-app \
        --bin vanling --bin audio-probe \
        --target xtensa-esp32s3-none-elf \
        -Z build-std=core,alloc \
        --no-default-features --features lckfb-szpi-esp32s3,console-auto
    outputs:
      - 'target/xtensa-esp32s3-none-elf/release/vanling'
      - 'target/xtensa-esp32s3-none-elf/release/audio-probe'
    deps:
      - ~:check-s3
    options:
      runInCI: false

  # The same product, booting onto the camera page. A page that would otherwise need a
  # triple-tap on the hardware is only benchable this way, so it is a second image rather
  # than a second way of producing the first one.
  #
  # Cargo writes it to the same path the product's image lives at, because it is the same
  # firmware from a different starting page, and there is no second target directory to put it
  # in: a bench task is not worth another few GB of build cache. So the product image is saved
  # and put back around the build, which is what keeps `vanling` meaning "the product" — without
  # it, whichever of the two tasks ran last decides what `flash-s3` and `iot-image.sh` pick up,
  # and a cached `build-s3` does not necessarily restore its own.
  #
  # Kept off CI: it is the same firmware with a different starting page.
  build-s3-camera:
    script: |
      out=target/xtensa-esp32s3-none-elf/release/vanling
      if [ -f "$out" ]; then cp "$out" "$out.product"; fi
      IOT_BOOT_PAGE=camera bash ../../scripts/iot-xtensa.sh build --release \
        -p iot-app --bin vanling \
        --target xtensa-esp32s3-none-elf \
        -Z build-std=core,alloc \
        --no-default-features --features lckfb-szpi-esp32s3,console-auto
      cp "$out" "$out-camera"
      if [ -f "$out.product" ]; then mv "$out.product" "$out"; fi
    outputs:
      - 'target/xtensa-esp32s3-none-elf/release/vanling-camera'
    deps:
      - ~:check-s3
    options:
      runInCI: false

  # The product with two planes turned down — the only shipped path that both gates a
  # plane (`audio=off`) and stretches one (`motion=on:30000`), so both halves of the
  # demand are exercised. Kept off CI like `build-s3-camera`: a different demand, not
  # a different product.
  build-s3-thrift:
    script: |
      out=target/xtensa-esp32s3-none-elf/release/vanling
      if [ -f "$out" ]; then cp "$out" "$out.product"; fi
      IOT_DEMAND='audio=off,display=on-change,motion=on:30000' \
        bash ../../scripts/iot-xtensa.sh build --release \
        -p iot-app --bin vanling \
        --target xtensa-esp32s3-none-elf \
        -Z build-std=core,alloc \
        --no-default-features --features lckfb-szpi-esp32s3,console-auto
      cp "$out" "$out-thrift"
      if [ -f "$out.product" ]; then mv "$out.product" "$out"; fi
    outputs:
      - 'target/xtensa-esp32s3-none-elf/release/vanling-thrift'
    deps:
      - ~:check-s3
    options:
      runInCI: false

  # Every S3 image is flashed against this repository's partition table rather than
  # the one `espflash` writes by default: the Wi-Fi driver's prebuilt blobs do not fit
  # the default 1 MB factory slot, and the table also decides whether the driver finds
  # a PHY calibration partition — see `partitions/lckfb-szpi-esp32s3.csv` for both.
  #
  # `--flash-size 16mb` comes with the table: the board is a 16 MB part and espflash
  # would otherwise assume 4 MB, which cannot hold a 6 MB factory slot — it then fails
  # on the table rather than on the image.
  flash-s3:
    script: |
      espflash flash --chip esp32s3 \
        --flash-size 16mb \
        --partition-table partitions/lckfb-szpi-esp32s3.csv \
        ${IOT_PORT:+--port $IOT_PORT} \
        target/xtensa-esp32s3-none-elf/release/vanling
    deps:
      - ~:build-s3
    options:
      persistent: true
      cache: false
      runInCI: false

  flash-s3-camera:
    script: |
      espflash flash --chip esp32s3 \
        --flash-size 16mb \
        --partition-table partitions/lckfb-szpi-esp32s3.csv \
        ${IOT_PORT:+--port $IOT_PORT} \
        target/xtensa-esp32s3-none-elf/release/vanling-camera
    deps:
      - ~:build-s3-camera
    options:
      persistent: true
      cache: false
      runInCI: false

  # Bench images: one peripheral each, so a fault belongs to a path rather than to the
  # product's three tasks contending for one executor. None is produced by build-s3, which
  # names only the product's own bins, so the product's artifacts and its flash task are
  # untouched. Repeated rather than shared: moon does not forward a child's `args` to an
  # inherited script, and each probe builds only its own bin.
  #
  #   probe-audio-s3      the speaker alone, looping the catalogue
  #   probe-camera-s3     the camera and the panel, and nothing else
  #   probe-multicore-s3  the second core and the main stack beneath it
  #   probe-demand-s3     one settled, measured cell per (configuration x cadence) pair
  #   probe-aec-s3        what one audio tick of the linear canceller costs, per tap count
  probe-audio-s3:
    script: |
      bash ../../scripts/iot-xtensa.sh build --release -p iot-app --bin audio-probe \
        --target xtensa-esp32s3-none-elf \
        -Z build-std=core,alloc \
        --no-default-features --features lckfb-szpi-esp32s3,console-auto
    outputs:
      - 'target/xtensa-esp32s3-none-elf/release/audio-probe'
    options:
      runInCI: false

  probe-camera-s3:
    script: |
      bash ../../scripts/iot-xtensa.sh build --release -p iot-app --bin camera-probe \
        --target xtensa-esp32s3-none-elf \
        -Z build-std=core,alloc \
        --no-default-features --features lckfb-szpi-esp32s3,console-auto
    outputs:
      - 'target/xtensa-esp32s3-none-elf/release/camera-probe'
    options:
      runInCI: false

  probe-multicore-s3:
    script: |
      bash ../../scripts/iot-xtensa.sh build --release -p iot-app --bin multicore-s3 \
        --target xtensa-esp32s3-none-elf \
        -Z build-std=core,alloc \
        --no-default-features --features lckfb-szpi-esp32s3,console-auto
    outputs:
      - 'target/xtensa-esp32s3-none-elf/release/multicore-s3'
    options:
      runInCI: false

  probe-aec-s3:
    script: |
      bash ../../scripts/iot-xtensa.sh build --release -p iot-app --bin aec-probe \
        --target xtensa-esp32s3-none-elf \
        -Z build-std=core,alloc \
        --no-default-features --features lckfb-szpi-esp32s3,console-auto
    outputs:
      - 'target/xtensa-esp32s3-none-elf/release/aec-probe'
    options:
      runInCI: false

  flash-probe-aec-s3:
    script: |
      espflash flash --chip esp32s3 -a watchdog-reset ${IOT_PORT:+--port $IOT_PORT} target/xtensa-esp32s3-none-elf/release/aec-probe
    deps:
      - ~:probe-aec-s3
    options:
      persistent: true
      cache: false

  #   probe-echo-s3       the speaker playing while the microphone listens, and the
  #                       canceller fed both: the pairing on a real room
  probe-echo-s3:
    script: |
      bash ../../scripts/iot-xtensa.sh build --release -p iot-app --bin echo-probe \
        --target xtensa-esp32s3-none-elf \
        -Z build-std=core,alloc \
        --no-default-features --features lckfb-szpi-esp32s3,console-auto
    outputs:
      - 'target/xtensa-esp32s3-none-elf/release/echo-probe'
    deps:
      - ~:check-s3
    options:
      runInCI: false

  flash-probe-echo-s3:
    script: |
      espflash flash --chip esp32s3 -a watchdog-reset ${IOT_PORT:+--port $IOT_PORT} target/xtensa-esp32s3-none-elf/release/echo-probe
    deps:
      - ~:probe-echo-s3
    options:
      persistent: true
      cache: false
      runInCI: false

  probe-clock-s3:
    script: |
      bash ../../scripts/iot-xtensa.sh build --release -p iot-app --bin clock-probe \
        --target xtensa-esp32s3-none-elf \
        -Z build-std=core,alloc \
        --no-default-features --features lckfb-szpi-esp32s3,console-auto
    outputs:
      - 'target/xtensa-esp32s3-none-elf/release/clock-probe'
    options:
      runInCI: false

  #   probe-wifi-s3       the radio, the IP stack and the credentials this build was
  #                       given, and nothing else: scan, associate, DHCP, then the
  #                       driver's heap and the stage timings for as long as it holds
  #   probe-wifi-c6       the same image on the other board: the probe's own code is
  #                       chip-agnostic, so only the part's memory budget differs
  #
  # Credentials are a build-time input, named in FORWARDED_ENV, so a bench run is one
  # command with two variables rather than a protocol typed on a panel this image
  # never lights. The two names are set on the invocation:
  #
  #   IOT_WIFI_SSID=home IOT_WIFI_PSK=secret moon run iot:probe-wifi-s3
  #
  # A build without them still runs and says that it has nothing to connect to, which
  # is the answer to "does the scan work on its own" without pretending to be a
  # connection test.
  probe-wifi-s3:
    script: |
      bash ../../scripts/iot-xtensa.sh build --release -p iot-app --bin wifi-probe \
        --target xtensa-esp32s3-none-elf \
        -Z build-std=core,alloc \
        --no-default-features --features lckfb-szpi-esp32s3,wifi,console-auto
    outputs:
      - 'target/xtensa-esp32s3-none-elf/release/wifi-probe'
    options:
      cache: false
      runInCI: false

  probe-wifi-c6:
    script: |
      bash ../../scripts/iot-xtensa.sh build --release -p iot-app --bin wifi-probe \
        --target riscv32imac-unknown-none-elf \
        -Z build-std=core,alloc \
        --no-default-features --features esp32c6-devkitc-1,wifi,console-auto
    outputs:
      - 'target/riscv32imac-unknown-none-elf/release/wifi-probe'
    options:
      cache: false
      runInCI: false

  # `-a watchdog-reset` on the S3 only. That board runs native USB, where a plain DTR reset
  # is a core reset that does not re-sample the boot strapping pins, so it lands in the ROM
  # downloader rather than the application — and espflash's watchdog reset is the way out. The
  # C6 boots on a plain DTR reset (`rst:0x15 (USB_UART_HPSYS),boot:0x1c (SPI_FAST_FLASH_BOOT)`)
  # and espflash refuses the watchdog reset on it outright, so adding it would break the task.
  # `@/development/iot/flashing.md` has why.
  flash-probe-wifi-s3:
    script: |
      espflash flash --chip esp32s3 \
        --flash-size 16mb \
        --partition-table partitions/lckfb-szpi-esp32s3.csv \
        -a watchdog-reset \
        ${IOT_PORT:+--port $IOT_PORT} \
        target/xtensa-esp32s3-none-elf/release/wifi-probe
    deps:
      - ~:probe-wifi-s3
    options:
      persistent: true
      cache: false
      runInCI: false

  flash-probe-wifi-c6:
    script: |
      espflash flash --chip esp32c6 \
        --partition-table partitions/esp32c6-devkitc-1.csv \
        ${IOT_PORT:+--port $IOT_PORT} \
        target/riscv32imac-unknown-none-elf/release/wifi-probe
    deps:
      - ~:probe-wifi-c6
    options:
      persistent: true
      cache: false
      runInCI: false

  flash-probe-clock-s3:
    script: |
      espflash flash --chip esp32s3 -a watchdog-reset ${IOT_PORT:+--port $IOT_PORT} target/xtensa-esp32s3-none-elf/release/clock-probe
    deps:
      - ~:probe-clock-s3
    options:
      persistent: true
      cache: false
      runInCI: false

  flash-probe-audio-s3:
    script: |
      espflash flash --chip esp32s3 -a watchdog-reset ${IOT_PORT:+--port $IOT_PORT} target/xtensa-esp32s3-none-elf/release/audio-probe
    deps:
      - ~:probe-audio-s3
    options:
      persistent: true
      cache: false
      runInCI: false

  flash-probe-camera-s3:
    script: |
      espflash flash --chip esp32s3 -a watchdog-reset ${IOT_PORT:+--port $IOT_PORT} target/xtensa-esp32s3-none-elf/release/camera-probe
    deps:
      - ~:probe-camera-s3
    options:
      persistent: true
      cache: false
      runInCI: false

  probe-demand-s3:
    script: |
      bash ../../scripts/iot-xtensa.sh build --release -p iot-app --bin demand-probe \
        --target xtensa-esp32s3-none-elf \
        -Z build-std=core,alloc \
        --no-default-features --features lckfb-szpi-esp32s3,console-auto
    outputs:
      - 'target/xtensa-esp32s3-none-elf/release/demand-probe'
    options:
      runInCI: false

  flash-probe-multicore-s3:
    script: |
      espflash flash --chip esp32s3 -a watchdog-reset ${IOT_PORT:+--port $IOT_PORT} target/xtensa-esp32s3-none-elf/release/multicore-s3
    deps:
      - ~:probe-multicore-s3
    options:
      persistent: true
      cache: false
      runInCI: false

  flash-s3-thrift:
    script: |
      espflash flash --chip esp32s3 \
        --flash-size 16mb \
        --partition-table partitions/lckfb-szpi-esp32s3.csv \
        ${IOT_PORT:+--port $IOT_PORT} \
        target/xtensa-esp32s3-none-elf/release/vanling-thrift
    deps:
      - ~:build-s3-thrift
    options:
      persistent: true
      cache: false
      runInCI: false

  flash-probe-demand-s3:
    script: |
      espflash flash --chip esp32s3 -a watchdog-reset ${IOT_PORT:+--port $IOT_PORT} target/xtensa-esp32s3-none-elf/release/demand-probe
    deps:
      - ~:probe-demand-s3
    options:
      persistent: true
      cache: false
      runInCI: false

  image:
    script: 'bash ../../scripts/iot-image.sh'
    deps:
      - ~:image-c6
      - ~:image-s3
    options:
      cache: false
      runInCI: false

  image-c6:
    script: 'bash ../../scripts/iot-image.sh esp32c6-devkitc-1'
    deps:
      - ~:build
    options:
      cache: false
      runInCI: false

  image-s3:
    script: 'bash ../../scripts/iot-image.sh lckfb-szpi-esp32s3'
    deps:
      - ~:build-s3
    options:
      cache: false
      runInCI: false

  # C6 emulator smoke: builds with the esp-println UART console (esp-emu only
  # scans UART0; see docs/content/development/iot/emulation.md) and boots the
  # merged image through esp-emu, asserting `[IOT] boot ok`.
  build-c6-emu:
    script: 'bash ../../scripts/iot-emu-image.sh'
    outputs:
      - 'target/emu/riscv32imac-unknown-none-elf/release/vanling'
    deps:
      - ~:check
    options:
      cache: false

  emu-smoke:
    script: 'bash ../../scripts/iot-emu.sh'
    deps:
      - ~:build-c6-emu
    options:
      cache: false
