language: 'rust'
tags: ['iot']

env:
  CARGO_ESP_TARGET: 'riscv32imac-unknown-none-elf'

# Declaring `inputs` replaces moon's default (every file), so `**/*` keeps that coverage —
# dotfiles and the non-Rust inputs (`sounds/*.mid`, `partitions/*.csv`, `linker/*.x`) — and
# the dispatcher is listed because no glob can leave the project.
fileGroups:
  build-inputs:
    - '**/*'
    - '/scripts/iot-xtensa.sh'

tasks:
  bump:
    script: |
      bash ../../scripts/bump.sh \
        "vanling-iot" \
        "Cargo.toml" \
        "apps/iot/**"
    options:
      runInCI: false

  format:
    command: 'cargo fmt --check'

  check:
    command: 'cargo check -p iot-app --bin vanling --target $CARGO_ESP_TARGET'
    inputs:
      - '$CARGO_ESP_TARGET'
      - '@group(build-inputs)'
    deps:
      - ~:format

  build:
    command: 'cargo build --release -p iot-app --bin vanling --target $CARGO_ESP_TARGET'
    inputs:
      - '$CARGO_ESP_TARGET'
      - '@group(build-inputs)'
    outputs:
      - 'target/$CARGO_ESP_TARGET/release/vanling'
    deps:
      - ~:check
    options:
      # `vanling` reads `IOT_WIFI_SSID`/`IOT_WIFI_PSK` with `option_env!`; a cached build
      # would return the previous password.
      cache: false

  # `iot-app`'s tests run on the host backend; `--lib` keeps the `vanling` bin out.
  test:
    script: 'cargo test -p iot-core && cargo test -p iot-app --lib --no-default-features --features host'
    deps:
      - ~:check

  test-bsp:
    command: >-
      cargo test -p iot-bsp-esp --no-default-features
      --features qmi8658,pca9557,es7210,es8311,gc2145,ft6336
    deps:
      - ~:check

  # The sound catalogue's files are build products of `iot-tool`'s table.
  test-tool:
    command: 'cargo test -p iot-tool'

  # Rebuild `sounds/*.mid` from the recipes. Writes the source tree, so never in CI.
  gen-midi-assets:
    command: 'cargo run --quiet -p iot-tool -- midi'
    options:
      cache: false
      runInCI: false

  # Every component feature compiled on its own (features.md rule 5). A board feature is
  # the union of what the board wires, so a component reaching for a part it does not name
  # stays invisible otherwise.
  check-features:
    script: 'bash ../../scripts/iot-feature-check.sh'
    inputs:
      - '@group(build-inputs)'
      - '/scripts/iot-feature-check.sh'
    options:
      # Real compiling: fifteen subsets, nine against bare-metal targets. Cached, an
      # unchanged tree returns in ~0.1s; a changed tree re-runs the matrix, which is the
      # only moment the answer can change.
      cache: true

  lint:
    command: 'cargo clippy -p iot-app --bin vanling --target $CARGO_ESP_TARGET -- -D warnings'
    inputs:
      - '$CARGO_ESP_TARGET'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'moon.yml'
      - '.cargo/config.toml'
      - 'crates/**/*.rs'
      - 'crates/**/Cargo.toml'
    deps:
      - ~:check

  lint-host:
    command: 'cargo clippy -p iot-core --all-targets -- -D warnings'
    deps:
      - ~:check

  lint-smoke:
    command: >-
      cargo clippy -p iot-app --bin host-smoke
      --no-default-features --features host -- -D warnings

  check-host:
    command: >-
      cargo check -p iot-app --bin host-smoke
      --no-default-features --features host

  smoke-host:
    command: >-
      cargo run --quiet -p iot-app --bin host-smoke
      --no-default-features --features host
    deps:
      - ~:check-host
    options:
      # The same content runs the same smoke; `moon run --force` replays it.
      cache: true

  # The partition table carries `creds` and `phy_init`; espflash's default has neither, so
  # the device would boot with no saved networks. An explicit `espflash` because the cargo
  # runner cannot receive `--partition-table`. `--flash-size 8mb` is the part's size.
  flash:
    script: |
      espflash flash --chip esp32c6 \
        --flash-size 8mb \
        --partition-table partitions/esp32c6-devkitc-1.csv \
        --monitor \
        ${IOT_PORT:+--port $IOT_PORT} \
        target/$CARGO_ESP_TARGET/release/vanling
    deps:
      - ~:build
    options:
      persistent: true
      cache: false
      runInCI: false

  # The S3 image for hosts without a native espup toolchain. Idempotent per toolchain.
  xtensa-image:
    script: bash ../../scripts/iot-xtensa-image.sh
    options:
      cache: false
      runInCI: false

  # s3 (xtensa-esp32s3): dispatched by scripts/iot-xtensa.sh, which uses the espup
  # toolchain (pinned 1.98.1.0) or the local image. Every bin is named so each probe is
  # type-checked; `wifi-probe` is named for its own `required-features`. `check-s3` does not
  # link, so the camera's 150 KB frame arena only shows up in `build-s3` / `image-s3`.
  check-s3:
    script: |
      bash ../../scripts/iot-xtensa.sh check -p iot-app \
        --bin vanling --bin audio-probe --bin camera-probe --bin multicore-s3 \
        --bin demand-probe --bin aec-probe --bin clock-probe --bin echo-probe \
        --bin wifi-probe \
        --target xtensa-esp32s3-none-elf \
        -Z build-std=core,alloc \
        --no-default-features --features lckfb-szpi-esp32s3,console-auto
      # `panel-bench` selects the other branch of the product entry.
      bash ../../scripts/iot-xtensa.sh check -p iot-app \
        --bin vanling \
        --target xtensa-esp32s3-none-elf \
        -Z build-std=core,alloc \
        --no-default-features --features lckfb-szpi-esp32s3,console-auto,panel-bench
    inputs:
      - '@group(build-inputs)'

  # The C6 is checked on its own toolchain: `riscv32imac-unknown-none-elf` ships a prebuilt
  # `core`/`alloc`, so no container and no `-Z build-std`. Same inputs as `check`; it adds
  # `wifi-probe`, whose `required-features` are `wifi`.
  check-c6:
    command: >-
      cargo check -p iot-app --bin vanling --bin wifi-probe
      --no-default-features --features esp32c6-devkitc-1,console-auto
      --target $CARGO_ESP_TARGET
    inputs:
      - '$CARGO_ESP_TARGET'
      - '@group(build-inputs)'
    deps:
      - ~:format

  build-s3:
    script: |
      bash ../../scripts/iot-xtensa.sh build --release -p iot-app \
        --bin vanling --bin audio-probe \
        --target xtensa-esp32s3-none-elf \
        -Z build-std=core,alloc \
        --no-default-features --features lckfb-szpi-esp32s3,console-auto
    outputs:
      - 'target/xtensa-esp32s3-none-elf/release/vanling'
      - 'target/xtensa-esp32s3-none-elf/release/audio-probe'
    deps:
      - ~:check-s3
    options:
      # Uncached: the credentials are compiled in (`option_env!`), and moon's cache does not
      # key on them. Cargo tracks `option_env!` itself, so a new password re-runs the build.
      cache: false
      runInCI: false

  # The same product booting onto the camera page. Cargo writes the same `vanling` path, so
  # the product image is saved and put back around the build.
  build-s3-camera:
    script: |
      # `set -e`: a failed build must not publish the stale product as the variant.
      set -e
      out=target/xtensa-esp32s3-none-elf/release/vanling
      if [ -f "$out" ]; then cp "$out" "$out.product"; fi
      IOT_BOOT_PAGE=camera bash ../../scripts/iot-xtensa.sh build --release \
        -p iot-app --bin vanling \
        --target xtensa-esp32s3-none-elf \
        -Z build-std=core,alloc \
        --no-default-features --features lckfb-szpi-esp32s3,console-auto
      cp "$out" "$out-camera"
      if [ -f "$out.product" ]; then mv "$out.product" "$out"; fi
    outputs:
      - 'target/xtensa-esp32s3-none-elf/release/vanling-camera'
    deps:
      - ~:check-s3
    options:
      cache: false
      runInCI: false

  # Two devices turned down — the only path that both gates (`audio=off`) and stretches
  # (`motion=on:30000`) a demand.
  build-s3-thrift:
    script: |
      set -e
      out=target/xtensa-esp32s3-none-elf/release/vanling
      if [ -f "$out" ]; then cp "$out" "$out.product"; fi
      IOT_DEMAND='audio=off,display=on-change,motion=on:30000' \
        bash ../../scripts/iot-xtensa.sh build --release \
        -p iot-app --bin vanling \
        --target xtensa-esp32s3-none-elf \
        -Z build-std=core,alloc \
        --no-default-features --features lckfb-szpi-esp32s3,console-auto
      cp "$out" "$out-thrift"
      if [ -f "$out.product" ]; then mv "$out.product" "$out"; fi
    outputs:
      - 'target/xtensa-esp32s3-none-elf/release/vanling-thrift'
    deps:
      - ~:check-s3
    options:
      cache: false
      runInCI: false

  # The Wi-Fi blobs do not fit espflash's default 1 MB factory slot, and the table decides
  # whether the PHY calibration partition is found. `--flash-size 16mb` comes with it.
  # `-a watchdog-reset`: a plain DTR reset does not re-sample strapping on native USB.
  flash-s3:
    script: |
      espflash flash --chip esp32s3 \
        --flash-size 16mb \
        --partition-table partitions/lckfb-szpi-esp32s3.csv \
        -a watchdog-reset \
        ${IOT_PORT:+--port $IOT_PORT} \
        target/xtensa-esp32s3-none-elf/release/vanling
    deps:
      - ~:build-s3
    options:
      persistent: true
      cache: false
      runInCI: false

  flash-s3-camera:
    script: |
      espflash flash --chip esp32s3 \
        --flash-size 16mb \
        --partition-table partitions/lckfb-szpi-esp32s3.csv \
        -a watchdog-reset \
        ${IOT_PORT:+--port $IOT_PORT} \
        target/xtensa-esp32s3-none-elf/release/vanling-camera
    deps:
      - ~:build-s3-camera
    options:
      persistent: true
      cache: false
      runInCI: false

  # A watchdog reset is a full system reset, so a chip stuck in the ROM downloader starts
  # the application without unplugging.
  reset-s3:
    script: |
      espflash reset --chip esp32s3 \
        ${IOT_PORT:+--port $IOT_PORT} \
        -a watchdog-reset
    options:
      cache: false
      runInCI: false

  # Types the credential on the panel at boot, through the same intent ring a finger uses.
  # `IOT_BOOT_PAGE=network` is part of the bench; `IOT_PANEL_BENCH` keeps the build
  # unconfigured so it has to use the panel.
  panel-typing-s3:
    script: |
      set -e
      out=target/xtensa-esp32s3-none-elf/release/vanling
      saved="$out.product"
      if [ -f "$out" ]; then mv "$out" "$saved"; fi
      trap 'if [ -f "$saved" ]; then mv "$saved" "$out"; else rm -f "$out"; fi' EXIT
      IOT_PANEL_BENCH=1 IOT_BOOT_PAGE=network \
        bash ../../scripts/iot-xtensa.sh build --release \
        -p iot-app --bin vanling \
        --target xtensa-esp32s3-none-elf \
        -Z build-std=core,alloc \
        --no-default-features --features lckfb-szpi-esp32s3,console-auto,panel-bench
      cp "$out" "$out-panel"
    outputs:
      - 'target/xtensa-esp32s3-none-elf/release/vanling-panel'
    deps:
      - ~:check-s3
    options:
      cache: false
      runInCI: false

  flash-panel-typing-s3:
    script: |
      espflash flash --chip esp32s3 \
        --flash-size 16mb \
        --partition-table partitions/lckfb-szpi-esp32s3.csv \
        -a watchdog-reset \
        ${IOT_PORT:+--port $IOT_PORT} \
        target/xtensa-esp32s3-none-elf/release/vanling-panel
    deps:
      - ~:panel-typing-s3
    options:
      persistent: true
      cache: false
      runInCI: false

  # Bench images: one peripheral each, so a fault belongs to a path rather than to the
  # product's tasks contending for one executor. Each builds only its own bin.
  probe-audio-s3:
    script: |
      bash ../../scripts/iot-xtensa.sh build --release -p iot-app --bin audio-probe \
        --target xtensa-esp32s3-none-elf \
        -Z build-std=core,alloc \
        --no-default-features --features lckfb-szpi-esp32s3,console-auto
    inputs:
      - '@group(build-inputs)'
    outputs:
      - 'target/xtensa-esp32s3-none-elf/release/audio-probe'
    options:
      runInCI: false

  probe-camera-s3:
    script: |
      bash ../../scripts/iot-xtensa.sh build --release -p iot-app --bin camera-probe \
        --target xtensa-esp32s3-none-elf \
        -Z build-std=core,alloc \
        --no-default-features --features lckfb-szpi-esp32s3,console-auto
    inputs:
      - '@group(build-inputs)'
    outputs:
      - 'target/xtensa-esp32s3-none-elf/release/camera-probe'
    options:
      runInCI: false

  probe-multicore-s3:
    script: |
      bash ../../scripts/iot-xtensa.sh build --release -p iot-app --bin multicore-s3 \
        --target xtensa-esp32s3-none-elf \
        -Z build-std=core,alloc \
        --no-default-features --features lckfb-szpi-esp32s3,console-auto
    inputs:
      - '@group(build-inputs)'
    outputs:
      - 'target/xtensa-esp32s3-none-elf/release/multicore-s3'
    options:
      runInCI: false

  probe-aec-s3:
    script: |
      bash ../../scripts/iot-xtensa.sh build --release -p iot-app --bin aec-probe \
        --target xtensa-esp32s3-none-elf \
        -Z build-std=core,alloc \
        --no-default-features --features lckfb-szpi-esp32s3,console-auto
    inputs:
      - '@group(build-inputs)'
    outputs:
      - 'target/xtensa-esp32s3-none-elf/release/aec-probe'
    options:
      runInCI: false

  flash-probe-aec-s3:
    script: |
      espflash flash --chip esp32s3 -a watchdog-reset ${IOT_PORT:+--port $IOT_PORT} target/xtensa-esp32s3-none-elf/release/aec-probe
    deps:
      - ~:probe-aec-s3
    options:
      persistent: true
      cache: false

  # The speaker playing while the microphone listens, with the canceller fed both.
  probe-echo-s3:
    script: |
      bash ../../scripts/iot-xtensa.sh build --release -p iot-app --bin echo-probe \
        --target xtensa-esp32s3-none-elf \
        -Z build-std=core,alloc \
        --no-default-features --features lckfb-szpi-esp32s3,console-auto
    inputs:
      - '@group(build-inputs)'
    outputs:
      - 'target/xtensa-esp32s3-none-elf/release/echo-probe'
    deps:
      - ~:check-s3
    options:
      runInCI: false

  flash-probe-echo-s3:
    script: |
      espflash flash --chip esp32s3 -a watchdog-reset ${IOT_PORT:+--port $IOT_PORT} target/xtensa-esp32s3-none-elf/release/echo-probe
    deps:
      - ~:probe-echo-s3
    options:
      persistent: true
      cache: false
      runInCI: false

  probe-clock-s3:
    script: |
      bash ../../scripts/iot-xtensa.sh build --release -p iot-app --bin clock-probe \
        --target xtensa-esp32s3-none-elf \
        -Z build-std=core,alloc \
        --no-default-features --features lckfb-szpi-esp32s3,console-auto
    inputs:
      - '@group(build-inputs)'
    outputs:
      - 'target/xtensa-esp32s3-none-elf/release/clock-probe'
    options:
      runInCI: false

  # Credentials are build-time inputs named in FORWARDED_ENV:
  #   IOT_WIFI_SSID=home IOT_WIFI_PSK=secret moon run iot:probe-wifi-s3
  # A build without them still scans and says it has nothing to connect to.
  probe-wifi-s3:
    script: |
      bash ../../scripts/iot-xtensa.sh build --release -p iot-app --bin wifi-probe \
        --target xtensa-esp32s3-none-elf \
        -Z build-std=core,alloc \
        --no-default-features --features lckfb-szpi-esp32s3,wifi,console-auto
    outputs:
      - 'target/xtensa-esp32s3-none-elf/release/wifi-probe'
    options:
      cache: false
      runInCI: false

  probe-wifi-c6:
    script: |
      bash ../../scripts/iot-xtensa.sh build --release -p iot-app --bin wifi-probe \
        --target riscv32imac-unknown-none-elf \
        -Z build-std=core,alloc \
        --no-default-features --features esp32c6-devkitc-1,wifi,console-auto
    outputs:
      - 'target/riscv32imac-unknown-none-elf/release/wifi-probe'
    options:
      cache: false
      runInCI: false

  # `-a watchdog-reset` on the S3 only: its native-USB reset path does not re-sample
  # strapping. The C6 boots on a plain DTR reset and espflash refuses it there.
  flash-probe-wifi-s3:
    script: |
      espflash flash --chip esp32s3 \
        --flash-size 16mb \
        --partition-table partitions/lckfb-szpi-esp32s3.csv \
        -a watchdog-reset \
        ${IOT_PORT:+--port $IOT_PORT} \
        target/xtensa-esp32s3-none-elf/release/wifi-probe
    deps:
      - ~:probe-wifi-s3
    options:
      persistent: true
      cache: false
      runInCI: false

  flash-probe-wifi-c6:
    script: |
      espflash flash --chip esp32c6 \
        --partition-table partitions/esp32c6-devkitc-1.csv \
        ${IOT_PORT:+--port $IOT_PORT} \
        target/riscv32imac-unknown-none-elf/release/wifi-probe
    deps:
      - ~:probe-wifi-c6
    options:
      persistent: true
      cache: false
      runInCI: false

  flash-probe-clock-s3:
    script: |
      espflash flash --chip esp32s3 -a watchdog-reset ${IOT_PORT:+--port $IOT_PORT} target/xtensa-esp32s3-none-elf/release/clock-probe
    deps:
      - ~:probe-clock-s3
    options:
      persistent: true
      cache: false
      runInCI: false

  flash-probe-audio-s3:
    script: |
      espflash flash --chip esp32s3 -a watchdog-reset ${IOT_PORT:+--port $IOT_PORT} target/xtensa-esp32s3-none-elf/release/audio-probe
    deps:
      - ~:probe-audio-s3
    options:
      persistent: true
      cache: false
      runInCI: false

  flash-probe-camera-s3:
    script: |
      espflash flash --chip esp32s3 -a watchdog-reset ${IOT_PORT:+--port $IOT_PORT} target/xtensa-esp32s3-none-elf/release/camera-probe
    deps:
      - ~:probe-camera-s3
    options:
      persistent: true
      cache: false
      runInCI: false

  probe-demand-s3:
    script: |
      bash ../../scripts/iot-xtensa.sh build --release -p iot-app --bin demand-probe \
        --target xtensa-esp32s3-none-elf \
        -Z build-std=core,alloc \
        --no-default-features --features lckfb-szpi-esp32s3,console-auto
    inputs:
      - '@group(build-inputs)'
    outputs:
      - 'target/xtensa-esp32s3-none-elf/release/demand-probe'
    options:
      runInCI: false

  flash-probe-multicore-s3:
    script: |
      espflash flash --chip esp32s3 -a watchdog-reset ${IOT_PORT:+--port $IOT_PORT} target/xtensa-esp32s3-none-elf/release/multicore-s3
    deps:
      - ~:probe-multicore-s3
    options:
      persistent: true
      cache: false
      runInCI: false

  flash-s3-thrift:
    script: |
      espflash flash --chip esp32s3 \
        --flash-size 16mb \
        --partition-table partitions/lckfb-szpi-esp32s3.csv \
        -a watchdog-reset \
        ${IOT_PORT:+--port $IOT_PORT} \
        target/xtensa-esp32s3-none-elf/release/vanling-thrift
    deps:
      - ~:build-s3-thrift
    options:
      persistent: true
      cache: false
      runInCI: false

  flash-probe-demand-s3:
    script: |
      espflash flash --chip esp32s3 -a watchdog-reset ${IOT_PORT:+--port $IOT_PORT} target/xtensa-esp32s3-none-elf/release/demand-probe
    deps:
      - ~:probe-demand-s3
    options:
      persistent: true
      cache: false
      runInCI: false

  image:
    script: 'bash ../../scripts/iot-image.sh'
    deps:
      - ~:image-c6
      - ~:image-s3
    options:
      cache: false
      runInCI: false

  image-c6:
    script: 'bash ../../scripts/iot-image.sh esp32c6-devkitc-1'
    deps:
      - ~:build
    options:
      cache: false
      runInCI: false

  image-s3:
    script: 'bash ../../scripts/iot-image.sh lckfb-szpi-esp32s3'
    deps:
      - ~:build-s3
    options:
      cache: false
      runInCI: false

  # C6 emulator smoke: the esp-println UART console, booted through esp-emu. See
  # docs/content/development/iot/emulation.md.
  build-c6-emu:
    script: 'bash ../../scripts/iot-emu-image.sh'
    outputs:
      - 'target/emu/riscv32imac-unknown-none-elf/release/vanling'
    deps:
      - ~:check
    options:
      cache: false

  emu-smoke:
    script: 'bash ../../scripts/iot-emu.sh'
    deps:
      - ~:build-c6-emu
    options:
      cache: false
