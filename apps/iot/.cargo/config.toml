[build]
target-dir = "target"

[target.riscv32imac-unknown-none-elf]
runner = "espflash flash --monitor"
rustflags = ["-C", "link-arg=-Tlinkall.x"]

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor"
# The second script lands after linkall.x and moves the main stack out of dram_seg.
# See crates/app/linker/esp32s3-main-stack.x.
rustflags = [
  "-C", "link-arg=-Tlinkall.x",
  "-C", "link-arg=-Tesp32s3-main-stack.x",
]

[env]
# The main stack gets whatever DRAM static data leaves over, so a `.bss` that grows eats
# it silently. esp-hal turns this into a link-time assertion. 56 KiB is 13 KB above the
# deepest reading (`[DISPLAY] stack peak 43224 B`, Camera page); the whole frame's paint
# runs on this stack.
ESP_HAL_CONFIG_ENSURE_MAIN_STACK_MINIMUM = "57344"

# esp-hal/esp-rtos hardware store watchpoints trip on legitimate stores and panic the boot
# (seen at render `on_appearance` on S3). Use the software canary instead: it checks the
# canary on every context switch and panics with the offending task.
ESP_RTOS_CONFIG_HW_TASK_OVERFLOW_DETECTION = "false"
ESP_HAL_CONFIG_STACK_GUARD_MONITORING = "false"
ESP_RTOS_CONFIG_SW_TASK_OVERFLOW_DETECTION = "true"

# `IOT_BOOT_PAGE` and `IOT_DEMAND` are deliberately absent: both are read with `option_env!`
# and their defaults live in the firmware, which reports at boot which one it used. A default
# here would duplicate it, and a typo here is indistinguishable from no setting. Pin one per
# build on the invocation, as `build-s3-camera` and `build-s3-thrift` do.
