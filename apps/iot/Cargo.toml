[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/chip-esp",
  "crates/bsp-esp",
  "crates/app",
  # Host-side: reads and writes this repository's source files, not the device.
  "crates/tool",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

# The AEC's cost is measured inside this profile, so the defaults are part of that
# measurement: `lto = false` with 16 codegen units leaves cross-crate calls
# unmoved and unoptimised across, which is a property of the schedule rather than
# of the code. `aec-probe` calls the filter across `iot-core` -> `iot-app`, so it
# is exactly the kind of call those defaults leave on the boundary.
[profile.release]
lto = true
codegen-units = 1

[workspace.dependencies]
critical-section = { version = "1.1", default-features = false }
embedded-alloc = "0.5.1"
embedded-graphics-core = { version = "0.4.1", default-features = false }
embedded-hal = { version = "1.0.0", default-features = false }
# `compat` only: the Wi-Fi driver links prebuilt C that allocates through
# `malloc`, so the binary needs those symbols. `global-allocator` stays off
# because the app's own allocator is `embedded-alloc`.
esp-alloc = { version = "0.11.0", default-features = false, features = ["compat"] }
esp-backtrace = { version = "0.20.0", features = ["panic-handler", "println"] }
esp-bootloader-esp-idf = "0.6.0"
esp-hal = { version = "1.2.2", default-features = false, features = [
  "rt",
  "unstable",
] }
esp-hal-smartled = "0.18.0"
esp-println = { version = "0.18.0", default-features = false, features = [
  "log-04",
] }
# Pinned exactly: this is the only release whose `esp-hal ~1.2.0` / `esp-rtos ^0.4.0`
# / `esp-config ^0.8.0` requirements match this tree (1.0.0-beta.2 is yanked), and a
# beta's API moving under a caret is exactly what a pin is for. The chip feature is
# added by the family alias, not here — one target's driver per build.
esp-radio = { version = "=1.0.0-beta.1", default-features = false, features = [
  "unstable",
  "wifi",
] }
esp-rtos = { version = "0.4.0", features = ["embassy"] }
# The credential store's side of the flash. The chip feature is added by the board
# feature, the same way `esp-radio`'s is: which part is being built is the board's to say.
esp-storage = "0.10.0"
embassy-executor = { version = "0.10.0", default-features = false }
embassy-futures = "0.1.2"
# The IP stack the Wi-Fi driver's frame interface feeds. `dhcpv4` is what turns
# "associated" into "has an address"; `dns`/`tcp` stay off until something actually
# opens a socket. `dhcpv4-hostname` is left off for the same reason — it needs
# `heapless` in the binary to name the type, and a name in the router's lease table
# is not worth a dependency until something reads it.
embassy-net = { version = "0.9.1", default-features = false, features = ["dhcpv4"] }
embassy-embedded-hal = { version = "0.6.0", default-features = false }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
log = "0.4.34"
libm = { version = "0.2", default-features = false }
mipidsi = "0.10.0"
smart-leds = "0.4.0"
iot-core = { path = "crates/core" }
iot-chip-esp = { path = "crates/chip-esp", default-features = false }
iot-bsp-esp = { path = "crates/bsp-esp", default-features = false }

