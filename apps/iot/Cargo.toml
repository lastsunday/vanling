[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/chip-esp",
  "crates/bsp-esp",
  "crates/app",
  # Host-side: reads and writes this repository's source files, not the device.
  "crates/tool",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

# The AEC cost is measured in this profile, so LTO and one codegen unit are part of the
# measurement: `aec-probe` calls the filter across `iot-core` -> `iot-app`.
[profile.release]
lto = true
codegen-units = 1

[workspace.dependencies]
critical-section = { version = "1.2.0", default-features = false }
embedded-alloc = { version = "0.7.0", default-features = false, features = ["llff"] }
embedded-graphics-core = { version = "0.4.1", default-features = false }
embedded-hal = { version = "1.0.0", default-features = false }
# `compat` only: the Wi-Fi driver's prebuilt C allocates through `malloc`. The app's own
# allocator stays `embedded-alloc`.
esp-alloc = { version = "0.11.0", default-features = false, features = ["compat"] }
# `custom-halt` turns a panic into a reset; without it the core parks in an interrupt-free
# loop. The halt itself is defined by the chip layer.
esp-backtrace = { version = "0.20.0", features = [
  "panic-handler",
  "println",
  "custom-halt",
] }
esp-bootloader-esp-idf = "0.6.0"
esp-hal = { version = "1.2.2", default-features = false, features = [
  "rt",
  "unstable",
] }
esp-hal-smartled = "0.18.0"
esp-println = { version = "0.18.0", default-features = false, features = [
  "log-04",
] }
# Pinned exactly: the only release whose `esp-hal ~1.2.0` / `esp-rtos ^0.4.0` /
# `esp-config ^0.8.0` requirements match this tree (1.0.0-beta.2 is yanked). The chip
# feature comes from the board.
esp-radio = { version = "=1.0.0-beta.1", default-features = false, features = [
  "unstable",
  "wifi",
] }
esp-rtos = { version = "0.4.0", features = ["embassy"] }
# The credential store's side of flash; the board adds the chip feature.
esp-storage = "0.10.0"
embassy-executor = { version = "0.10.0", default-features = false }
embassy-futures = "0.1.2"
# `dhcpv4` turns "associated" into "has an address"; `tcp`/`udp` serve the setup portal.
# `dns` is off because the captive portal parses the wire format itself; `dhcpv4-hostname`
# is off because it needs `heapless` for a name nothing reads.
embassy-net = { version = "0.9.1", default-features = false, features = [
  "dhcpv4",
  "tcp",
  "udp",
] }
# `embassy-net` has no DHCP server; the setup access point's leases come from here. `0.8` is
# the line paired with `embassy-net 0.9` / `edge-nal 0.7`.
edge-dhcp = { version = "0.8.0", default-features = false, features = ["io"] }
edge-nal = { version = "0.7.0", default-features = false }
# `udp` alone: the DHCP server's one socket is the only user. `proto-ipv4` is required even
# though `embassy-net` carries IPv4 — without it `to_emb_addr` answers `None` and the DHCP
# reply dies as `UnsupportedProto`. A host test in `crates/app` holds the line.
edge-nal-embassy = { version = "0.9.0", default-features = false, features = [
  "proto-ipv4",
  "udp",
] }
embassy-embedded-hal = { version = "0.6.0", default-features = false }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
log = "0.4.34"
libm = { version = "0.2.16", default-features = false }
mipidsi = "0.10.0"
smart-leds = "0.4.0"
iot-core = { path = "crates/core" }
iot-chip-esp = { path = "crates/chip-esp", default-features = false }
iot-bsp-esp = { path = "crates/bsp-esp", default-features = false }
