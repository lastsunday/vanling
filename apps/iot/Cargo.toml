[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/ui",
  "crates/chip-esp",
  "crates/bsp-esp",
  "crates/app",
  # Host-side: reads and writes this repository's source files, not the device.
  "crates/tool",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

# The AEC's cost is measured inside this profile, so the defaults are part of that
# measurement: `lto = false` with 16 codegen units leaves cross-crate calls
# unmoved and unoptimised across, which is a property of the schedule rather than
# of the code. `aec-probe` calls the filter across `iot-core` -> `iot-app`, so it
# is exactly the kind of call those defaults leave on the boundary.
[profile.release]
lto = true
codegen-units = 1

[workspace.dependencies]
critical-section = { version = "1.1", default-features = false }
embedded-alloc = "0.5.1"
embedded-graphics-core = { version = "0.4.1", default-features = false }
embedded-hal = { version = "1.0.0", default-features = false }
# `compat` only: the Wi-Fi driver links prebuilt C that allocates through
# `malloc`, so the binary needs those symbols. `global-allocator` stays off
# because the app's own allocator is `embedded-alloc`.
esp-alloc = { version = "0.11.0", default-features = false, features = ["compat"] }
esp-backtrace = { version = "0.20.0", features = ["panic-handler", "println"] }
esp-bootloader-esp-idf = "0.6.0"
esp-hal = { version = "1.2.2", default-features = false, features = [
  "rt",
  "unstable",
] }
esp-hal-smartled = "0.18.0"
esp-println = { version = "0.18.0", default-features = false, features = [
  "log-04",
] }
# Pinned exactly: this is the only release whose `esp-hal ~1.2.0` / `esp-rtos ^0.4.0`
# / `esp-config ^0.8.0` requirements match this tree (1.0.0-beta.2 is yanked), and a
# beta's API moving under a caret is exactly what a pin is for. The chip feature is
# added by the family alias, not here — one target's driver per build.
esp-radio = { version = "=1.0.0-beta.1", default-features = false, features = [
  "unstable",
  "wifi",
] }
esp-rtos = { version = "0.4.0", features = ["embassy"] }
# The credential store's side of the flash. The chip feature is added by the board
# feature, the same way `esp-radio`'s is: which part is being built is the board's to say.
esp-storage = "0.10.0"
embassy-executor = { version = "0.10.0", default-features = false }
embassy-futures = "0.1.2"
# The IP stack the Wi-Fi driver's frame interface feeds. `dhcpv4` is what turns
# "associated" into "has an address". `tcp`/`udp` are on because setup mode serves
# the config page and answers DHCP and DNS on the access point's own stack; the
# station link still opens no socket of its own. `dns` stays off — the only name
# lookups here are the captive-portal responder, which parses the wire format
# itself. `dhcpv4-hostname` is left off because it needs `heapless` in the binary
# to name the type, and a name in the router's lease table is not worth a
# dependency until something reads it.
embassy-net = { version = "0.9.1", default-features = false, features = [
  "dhcpv4",
  "tcp",
  "udp",
] }
# The setup access point's own services. `embassy-net` carries DHCP for a client
# and nothing for a server, so the leases the config page's clients need come from
# here. It is `0.8` because that is the line whose own deps are `embassy-net 0.9` /
# `edge-nal 0.7`, which is this tree's pair: `edge-nal-embassy` 0.8.x is built
# against `embassy-net 0.8`.
edge-dhcp = { version = "0.8.0", default-features = false, features = ["io"] }
edge-nal = { version = "0.7.0", default-features = false }
# `udp` alone rather than the crate's `all`: the DHCP server binds a UDP socket through this
# crate and nothing else here does — the name server and the page are `embassy-net`'s own
# sockets — so `tcp`, `dns` and `icmp` would be code every board links and no board calls.
#
# `proto-ipv4` is not covered by `embassy-net` carrying IPv4: the crate gates its own address
# conversion on its own copy of the feature, so with it off `to_emb_addr` answers `None` for
# every IPv4 address and the DHCP server's reply — the one send it makes — dies as
# `UnsupportedProto`. Nothing in the build says so: the crate compiles, the socket binds and
# receives, and the only symptom is a phone that joined the access point sitting on
# "connecting". A host test in `crates/app` holds the line.
edge-nal-embassy = { version = "0.9.0", default-features = false, features = [
  "proto-ipv4",
  "udp",
] }
embassy-embedded-hal = { version = "0.6.0", default-features = false }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
log = "0.4.34"
libm = { version = "0.2", default-features = false }
mipidsi = "0.10.0"
smart-leds = "0.4.0"
iot-core = { path = "crates/core" }
iot-ui = { path = "crates/ui" }
iot-chip-esp = { path = "crates/chip-esp", default-features = false }
iot-bsp-esp = { path = "crates/bsp-esp", default-features = false }

