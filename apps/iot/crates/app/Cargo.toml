[package]
name = "iot-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "vanling"
path = "src/main.rs"

[[bin]]
name = "host-smoke"
path = "src/bin/host-smoke/main.rs"
required-features = ["host"]

# Probes are gated on the board whose hardware they wire, and named out of the product
# tasks (`--bin vanling`). `echo-probe` is declared because Cargo gives a discovered bin
# no `required-features`, so the C6 build would otherwise try to compile S3-only symbols.
[[bin]]
name = "audio-probe"
path = "src/bin/audio-probe.rs"
required-features = ["lckfb-szpi-esp32s3"]

[[bin]]
name = "camera-probe"
path = "src/bin/camera-probe.rs"
required-features = ["lckfb-szpi-esp32s3"]

[[bin]]
name = "aec-probe"
path = "src/bin/aec-probe.rs"
required-features = ["lckfb-szpi-esp32s3"]

[[bin]]
name = "clock-probe"
path = "src/bin/clock-probe.rs"
required-features = ["lckfb-szpi-esp32s3"]

[[bin]]
name = "demand-probe"
path = "src/bin/demand-probe.rs"
required-features = ["lckfb-szpi-esp32s3"]

[[bin]]
name = "multicore-s3"
path = "src/bin/multicore-s3.rs"
required-features = ["lckfb-szpi-esp32s3"]

[[bin]]
name = "echo-probe"
path = "src/bin/echo-probe.rs"
required-features = ["lckfb-szpi-esp32s3"]

# Radio, IP stack and credentials only: no panel, touch, motion or audio.
# Credentials come from the build (`FORWARDED_ENV`); a build without them says so.
[[bin]]
name = "wifi-probe"
path = "src/bin/wifi-probe.rs"
required-features = ["wifi"]

[features]
default = ["esp32c6-devkitc-1", "console-auto"]
# Selects `bench::run` over `lib::run` for the panel-typing replay; same bin and boot.
panel-bench = ["lckfb-szpi-esp32s3"]
esp32c6 = [
  "dep:iot-chip-esp",
  "dep:esp-hal",
  "dep:esp-rtos",
  "dep:esp-backtrace",
  "dep:esp-bootloader-esp-idf",
  "iot-chip-esp/esp32c6",
  "esp-backtrace/esp32c6",
  "esp-bootloader-esp-idf/esp32c6",
  "esp-hal/esp32c6",
  "esp-println/esp32c6",
  "esp-rtos/esp32c6",
]
# The devkit's radio is on the board, so its heap and the IP stack must fit this part's
# DRAM too.
esp32c6-devkitc-1 = [
  "esp32c6",
  "dep:iot-bsp-esp",
  "iot-bsp-esp/esp32c6-devkitc-1",
  "wifi",
]
esp32s3 = [
  "dep:iot-chip-esp",
  "dep:esp-hal",
  "dep:esp-rtos",
  "dep:esp-backtrace",
  "dep:esp-bootloader-esp-idf",
  "iot-chip-esp/esp32s3",
  "esp-backtrace/esp32s3",
  "esp-bootloader-esp-idf/esp32s3",
  "esp-hal/esp32s3",
  "esp-println/esp32s3",
  "esp-rtos/esp32s3",
]
# The board carries its own radio, so the product's link is what proves the driver's heap
# fits; naming it also lets `check-s3` compile `wifi-probe` without a second feature set.
lckfb-szpi-esp32s3 = [
  "esp32s3",
  "dep:iot-bsp-esp",
  "iot-bsp-esp/lckfb-szpi-esp32s3",
  "wifi",
]
# The camera alone, for `check-features` and a board that mounts a sensor the product does
# not draw. Not a product tier: the panel allocates the buffer either way.
camera = ["iot-bsp-esp/camera"]
# The radio alone. The setup access point's services come with it: a board with a radio and
# no screen has no other way to be configured.
wifi = [
  "iot-bsp-esp/wifi",
  "iot-chip-esp?/radio",
  "dep:embassy-net",
  "dep:edge-dhcp",
  "dep:edge-nal",
  "dep:edge-nal-embassy",
]

# `console-auto` mirrors the device: USB-Serial/JTAG when a host is attached, UART
# otherwise. `console-uart` forces UART0 for the esp-emu smoke. Both forward to the chip
# layer, which is where esp-println is pulled in.
console-auto = ["esp-println/auto", "iot-chip-esp?/console-auto"]
console-uart = ["esp-println/uart", "iot-chip-esp?/console-uart"]

# Host testing backend (development machine, no ESP hardware).
host = [
  "embassy-executor/platform-std",
  "embassy-executor/executor-thread",
  "embassy-time/std",
  "dep:critical-section",
  "critical-section/std",
]

[dependencies]
critical-section = { workspace = true, optional = true }
edge-dhcp = { workspace = true, optional = true }
edge-nal = { workspace = true, optional = true }
edge-nal-embassy = { workspace = true, optional = true }
embassy-executor = { workspace = true }
embassy-futures = { workspace = true }
embassy-net = { workspace = true, optional = true }
embassy-sync = { workspace = true }
embassy-time = { workspace = true }
embedded-alloc = { workspace = true }
esp-backtrace = { workspace = true, optional = true }
esp-bootloader-esp-idf = { workspace = true, optional = true }
esp-hal = { workspace = true, optional = true }
esp-println = { workspace = true, optional = true }
esp-rtos = { workspace = true, optional = true }
iot-bsp-esp = { workspace = true, optional = true }
iot-chip-esp = { workspace = true, optional = true }
iot-core = { workspace = true }
log = { workspace = true }
