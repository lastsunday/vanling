[package]
name = "iot-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "vanling"
path = "src/main.rs"

[[bin]]
name = "host-smoke"
path = "src/bin/host-smoke.rs"
required-features = ["host"]

# Playback isolation probe. Gated on the S3 board because that is the only board
# whose speaker this bring-up knows how to wire, and left out of the product
# tasks by name: every `iot:*` task that builds firmware passes `--bin vanling`.
[[bin]]
name = "audio-probe"
path = "src/bin/audio-probe.rs"
required-features = ["lckfb-szpi-esp32s3"]

# Camera isolation probe: the sensor and the panel and nothing else, so a fault belongs to
# the capture path rather than to the product's pages contending for one buffer. Gated on the
# S3 alone because the board feature now carries `camera` with the rest of the panel wiring,
# so there is nothing extra to ask for.
[[bin]]
name = "camera-probe"
path = "src/bin/camera-probe.rs"
required-features = ["lckfb-szpi-esp32s3"]

# Multi-core isolation probe: the second core and the main stack beneath it. Gated on
# the S3 because it is the only board here whose ROM boots a second core. Left out of
# the product tasks by name, like the other probes.

[[bin]]
name = "multicore-s3"
path = "src/bin/multicore-s3.rs"
required-features = ["lckfb-szpi-esp32s3"]

[features]
default = ["esp32c6-devkitc-1", "console-auto"]
esp32c6 = [
  "dep:iot-chip-esp", "dep:esp-hal", "dep:esp-rtos",
  "dep:esp-backtrace", "dep:esp-bootloader-esp-idf",
  "iot-chip-esp/esp32c6",
  "esp-backtrace/esp32c6", "esp-bootloader-esp-idf/esp32c6",
  "esp-hal/esp32c6", "esp-println/esp32c6", "esp-rtos/esp32c6",
]
esp32c6-devkitc-1 = ["esp32c6", "dep:iot-bsp-esp", "iot-bsp-esp/esp32c6-devkitc-1"]
esp32s3 = [
  "dep:iot-chip-esp", "dep:esp-hal", "dep:esp-rtos",
  "dep:esp-backtrace", "dep:esp-bootloader-esp-idf",
  "iot-chip-esp/esp32s3",
  "esp-backtrace/esp32s3", "esp-bootloader-esp-idf/esp32s3",
  "esp-hal/esp32s3", "esp-println/esp32s3", "esp-rtos/esp32s3",
]
lckfb-szpi-esp32s3 = ["esp32s3", "dep:iot-bsp-esp", "iot-bsp-esp/lckfb-szpi-esp32s3"]
# The camera, on its own. The S3 board feature carries it with the rest of its wiring, so
# this exists for a board that mounts a sensor the product does not draw, and for
# `check-features` to build the capture path alone. It is not a product tier: the product's
# camera is not optional at runtime, because the panel has the buffer either way.
camera = ["iot-bsp-esp/camera"]

# Log console routing for esp_println. `console-auto` mirrors device behavior:
# USB-Serial/JTAG when a host is attached, UART otherwise. `console-uart` forces
# UART0, which the esp-emu smoke build needs -- the emulator only scans UART0
# for --exit-on (see docs/content/development/iot/emulation.md).
console-auto = ["esp-println/auto"]
console-uart = ["esp-println/uart"]

# Host testing backend (runs on the development machine, no ESP hardware).
host = [
  "embassy-executor/platform-std", "embassy-executor/executor-thread",
  "embassy-time/std",
  "dep:critical-section", "critical-section/std",
]

[dependencies]
critical-section = { workspace = true, optional = true }
embassy-executor = { workspace = true }
embassy-futures = { workspace = true }
embassy-sync = { workspace = true }
embassy-time = { workspace = true }
embedded-alloc = { workspace = true }
esp-backtrace = { workspace = true, optional = true }
esp-bootloader-esp-idf = { workspace = true, optional = true }
esp-hal = { workspace = true, optional = true }
esp-println = { workspace = true, optional = true }
esp-rtos = { workspace = true, optional = true }
iot-bsp-esp = { workspace = true, optional = true }
iot-chip-esp = { workspace = true, optional = true }
iot-core = { workspace = true }
log = { workspace = true }