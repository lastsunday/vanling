[package]
name = "iot-tool"
version.workspace = true
edition.workspace = true

[dependencies]
# The cutter's one dependency, and only for reading an OTF's outlines. It stays out of the
# device crates: a change on that side cannot break the thing that builds its assets.
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }
