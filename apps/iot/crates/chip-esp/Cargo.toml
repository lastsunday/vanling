[package]
name = "iot-chip-esp"
version.workspace = true
edition.workspace = true

[features]
default = ["esp32c6"]

# One chip feature per part, carrying the chip of every esp crate this one pulls in.
# Each of those crates fails its build script without a chip, so naming them here lets
# the chip layer stand alone in `scripts/iot-feature-check.sh`.
esp32c6 = [
  "esp-hal/esp32c6",
  "esp-rtos/esp32c6",
  "esp-println/esp32c6",
  "esp-backtrace/esp32c6",
  "esp-bootloader-esp-idf/esp32c6",
  "esp-alloc?/esp32c6",
]
esp32s3 = [
  "esp-hal/esp32s3",
  "esp-rtos/esp32s3",
  "esp-println/esp32s3",
  "esp-backtrace/esp32s3",
  "esp-bootloader-esp-idf/esp32s3",
  "esp-alloc?/esp32s3",
]
# The Wi-Fi driver's heap and its scheduler tasks. The code is `radio/`, gated once;
# the chip of `esp-alloc` comes from the chip features above, as the board decides it.
radio = ["dep:esp-alloc", "esp-rtos/esp-radio"]

# Where `logging::LOGGER` writes. esp-println requires exactly one console feature, so a
# chip-only build has to be able to name one; images forward from `iot-app`.
console-auto = ["esp-println/auto"]
console-uart = ["esp-println/uart"]

[dependencies]
critical-section = { workspace = true }
embedded-alloc = { workspace = true }
embassy-executor = { workspace = true }
embassy-time = { workspace = true }
esp-alloc = { workspace = true, optional = true }
esp-backtrace = { workspace = true }
esp-bootloader-esp-idf = { workspace = true }
esp-hal = { workspace = true }
esp-println = { workspace = true }
esp-rtos = { workspace = true }
iot-core = { workspace = true }
log = { workspace = true }
