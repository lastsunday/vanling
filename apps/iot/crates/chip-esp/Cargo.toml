[package]
name = "iot-chip-esp"
version.workspace = true
edition.workspace = true

[features]
default = ["esp32c6"]

# One chip feature per part, and each carries the chip of every crate this one pulls
# in that has a chip axis of its own. esp-hal, esp-rtos, esp-println, esp-backtrace and
# esp-bootloader-esp-idf all fail their build script outright when no chip is named for
# them, and naming them here rather than in each image is what lets a build that reaches
# the chip layer without an app — what `scripts/iot-feature-check.sh` does — stand up on
# its own.
esp32c6 = [
  "esp-hal/esp32c6",
  "esp-rtos/esp32c6",
  "esp-println/esp32c6",
  "esp-backtrace/esp32c6",
  "esp-bootloader-esp-idf/esp32c6",
  "esp-alloc?/esp32c6",
]
esp32s3 = [
  "esp-hal/esp32s3",
  "esp-rtos/esp32s3",
  "esp-println/esp32s3",
  "esp-backtrace/esp32s3",
  "esp-bootloader-esp-idf/esp32s3",
  "esp-alloc?/esp32s3",
]
# The heap the Wi-Fi driver links against, and the scheduler integration its tasks
# need. A component axis like any other here: the code lives in `radio/`, gated
# once, and a build without a radio carries none of it.
#
# The chip of `esp-alloc` is named by the chip features above rather than here, the
# same way a board names its radio's blob: which part is being built is the one that
# knows. `scripts/iot-feature-check.sh` builds this component alone, so the entry
# there names the chip for the same reason an image does.
radio = ["dep:esp-alloc", "esp-rtos/esp-radio"]

# Where `logging::LOGGER` writes. esp-println's build script fails the build unless
# exactly one console is named, and this crate is what pulls esp-println in, so a
# build that reaches the chip layer without an app alongside it has to be able to name
# one here. An image picks its own: `iot-app`'s `console-auto` / `console-uart`
# forward to these.
console-auto = ["esp-println/auto"]
console-uart = ["esp-println/uart"]

[dependencies]
critical-section = { workspace = true }
embedded-alloc = { workspace = true }
embassy-executor = { workspace = true }
esp-alloc = { workspace = true, optional = true }
esp-backtrace = { workspace = true }
esp-bootloader-esp-idf = { workspace = true }
esp-hal = { workspace = true }
esp-println = { workspace = true }
esp-rtos = { workspace = true }
iot-core = { workspace = true }
log = { workspace = true }