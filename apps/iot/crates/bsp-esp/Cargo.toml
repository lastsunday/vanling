[package]
name = "iot-bsp-esp"
version.workspace = true
edition.workspace = true

[features]
default = ["esp32c6-devkitc-1"]
# Real components: one feature per module. A board feature below is the union of the
# components its wiring needs.
backlight = ["dep:esp-hal"]
button = ["dep:esp-hal"]
pca9557 = ["dep:embedded-hal"]
qmi8658 = ["dep:embedded-hal"]
es7210 = ["dep:embedded-hal"]
es8311 = ["dep:embedded-hal"]
ft6336 = ["dep:embassy-embedded-hal", "dep:embassy-sync", "dep:embedded-hal"]
gc2145 = ["dep:embedded-hal"]
ws2812 = ["dep:esp-hal", "dep:esp-hal-smartled", "dep:smart-leds"]
st7789 = ["dep:esp-hal", "dep:embedded-hal", "dep:mipidsi", "dep:embassy-futures"]
# Virtual components, assembled from real ones.
# `screen` names the codec because the Audio page reads its calibrated levels, and the
# backlight because the surface drives it with the breathing envelope.
screen = ["st7789", "es7210", "backlight", "dep:embassy-sync", "dep:embassy-executor"]
# Capture: a DMA ring and the ADC. `embassy-sync` is the reference cell shared with the
# speaker's interrupt-driven feed, so it cannot live on either driver.
audio = ["es7210", "dep:esp-hal", "dep:embassy-sync"]
# Playback: the DAC and its DMA ring. Independent of capture, because a speaker without a
# microphone is a real board.
audio-out = ["es8311", "dep:esp-hal", "dep:embassy-sync"]
# The sensor plus the chip HAL for its ring and DMA. Separate from `gc2145` so the driver's
# register table can be tested on a host.
camera = ["gc2145", "dep:esp-hal"]
# The radio, with the chip layer named here because the driver's heap lives there: with
# only `esp-radio` on, the build links without `malloc` (features.md rule 5).
# The credential store rides along: no radio means nothing to keep.
wifi = [
  "dep:esp-radio",
  "dep:esp-storage",
  "dep:esp-bootloader-esp-idf",
  "dep:iot-chip-esp",
  "iot-chip-esp?/radio",
]

esp32c6-devkitc-1 = ["button", "ws2812", "wifi", "esp-radio/esp32c6", "esp-storage/esp32c6"]
# Board features are the hardware axis, so they contribute each component's chip feature.
lckfb-szpi-esp32s3 = ["button", "pca9557", "qmi8658", "st7789", "screen", "backlight", "ft6336", "audio", "audio-out", "camera", "wifi", "esp-radio/esp32s3", "esp-storage/esp32s3"]

[dependencies]
embedded-hal = { workspace = true, optional = true }
embassy-embedded-hal = { workspace = true, optional = true }
embassy-sync = { workspace = true, optional = true }
iot-core = { workspace = true }
iot-chip-esp = { workspace = true, optional = true }
log = { workspace = true }
mipidsi = { workspace = true, optional = true }

# The chip HAL only builds for bare metal; keeping it out of the host build is what lets
# the `embedded_hal` components above be unit tested on a workstation.
[target.'cfg(target_os = "none")'.dependencies]
embassy-executor = { workspace = true, optional = true }
embassy-futures = { workspace = true, optional = true }
esp-bootloader-esp-idf = { workspace = true, optional = true }
esp-hal = { workspace = true, optional = true }
esp-hal-smartled = { workspace = true, optional = true }
esp-radio = { workspace = true, optional = true }
esp-storage = { workspace = true, optional = true }
smart-leds = { workspace = true, optional = true }
