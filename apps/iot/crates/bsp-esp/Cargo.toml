[package]
name = "iot-bsp-esp"
version.workspace = true
edition.workspace = true

[features]
default = ["esp32c6-devkitc-1"]
# Real components: one feature per module (one axis, module-backed); a board
# feature below is the aggregate of the wiring it needs.
backlight = ["dep:esp-hal"]
button = ["dep:esp-hal"]
pca9557 = ["dep:embedded-hal"]
qmi8658 = ["dep:embedded-hal"]
es7210 = ["dep:embedded-hal"]
es8311 = ["dep:embedded-hal"]
ft6336 = ["dep:embassy-embedded-hal", "dep:embassy-sync", "dep:embedded-hal"]
gc2145 = ["dep:embedded-hal"]
ws2812 = ["dep:esp-hal", "dep:esp-hal-smartled", "dep:smart-leds"]
st7789 = ["dep:esp-hal", "dep:embedded-hal", "dep:mipidsi"]
# Virtual components: assembled from real components.
# The Audio page reports the codec's own levels, so it needs the calibration
# that codec's gain and analog rail imply — which is why the driver is one of
# its inputs and not only a thing the board wires up. The backlight is the
# panel's own brightness channel, and this surface drives it to follow the
# breathing envelope, so the component is named here rather than left to the
# board aggregation that happens to enable it today.
display-light = ["st7789", "es7210", "backlight"]
# The capture side: a ring in DMA memory, so the chip HAL and the codec driver.
audio = ["es7210", "dep:esp-hal"]
# The playback side: the DAC driver, and a ring in DMA memory for the
# transport. It does not depend on the capture, because a speaker with no
# microphone is a real board and the other way round.
audio-out = ["es8311", "dep:esp-hal"]
# The capture side: the sensor driver plus the chip HAL for the ring and the DMA
# behind it. Separate from `gc2145` because the driver stands on its own on a host
# and its register table is worth testing without a chip in the room.
camera = ["gc2145", "dep:esp-hal"]


esp32c6-devkitc-1 = ["button", "ws2812"]
lckfb-szpi-esp32s3 = ["button", "pca9557", "qmi8658", "st7789", "display-light", "backlight", "ft6336", "audio", "audio-out", "camera"]

[dependencies]
embedded-hal = { workspace = true, optional = true }
embassy-embedded-hal = { workspace = true, optional = true }
embassy-sync = { workspace = true, optional = true }
iot-core = { workspace = true }
log = { workspace = true }
mipidsi = { workspace = true, optional = true }

# The chip HAL only builds for a bare-metal target, so keeping it out of the
# host build is what lets the pure `embedded_hal` components above be unit
# tested on a workstation.
[target.'cfg(target_os = "none")'.dependencies]
esp-hal = { workspace = true, optional = true }
esp-hal-smartled = { workspace = true, optional = true }
smart-leds = { workspace = true, optional = true }