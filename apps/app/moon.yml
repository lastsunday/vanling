language: "dart"
tags: ["mobile", "flutter"]

tasks:
  bump:
    script: |
      bash ../../scripts/bump.sh \
        "chobits-app" \
        "pubspec.yaml" \
        "apps/app/**"
    options:
      runInCI: false

  analyze:
    command: "flutter analyze"
    inputs:
      - "/.fvmrc"
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"

  format:
    command: "dart format ."
    options:
      runInCI: false

  test:
    command: "flutter test"
    inputs:
      - "/.fvmrc"
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"

  build-android:
    script: |
      VERSION=$(bash ../../scripts/version.sh pubspec.yaml)
      flutter build apk --release --build-name="$VERSION" --build-number="${BUILD_NUMBER:-0}"
    inputs:
      - "/.fvmrc"
      - "lib/**"
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
    options:
      runInCI: true

  build-ios:
    script: |
      VERSION=$(bash ../../scripts/version.sh pubspec.yaml)
      flutter build ios --release --no-codesign
    inputs:
      - "/.fvmrc"
      - "lib/**"
      - "ios/**"
      - "pubspec.yaml"
      - "pubspec.lock"
    options:
      os: "macos"
      runInCI: true

  build-web:
    script: |
      VERSION=$(bash ../../scripts/version.sh pubspec.yaml)
      flutter build web --release
    inputs:
      - "/.fvmrc"
      - "lib/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
    options:
      runInCI: true

  build-linux:
    script: |
      VERSION=$(bash ../../scripts/version.sh pubspec.yaml)
      flutter build linux --release
    inputs:
      - "/.fvmrc"
      - "lib/**"
      - "linux/**"
      - "pubspec.yaml"
      - "pubspec.lock"
    options:
      runInCI: true

  build-macos:
    script: |
      VERSION=$(bash ../../scripts/version.sh pubspec.yaml)
      flutter build macos --release
    inputs:
      - "/.fvmrc"
      - "lib/**"
      - "macos/**"
      - "pubspec.yaml"
      - "pubspec.lock"
    options:
      os: "macos"
      runInCI: true

  build-windows:
    script: |
      VERSION=$(bash ../../scripts/version.sh pubspec.yaml)
      flutter build windows --release
    inputs:
      - "/.fvmrc"
      - "lib/**"
      - "windows/**"
      - "pubspec.yaml"
      - "pubspec.lock"
    options:
      os: "windows"
      runInCI: true
      windowsShell: "bash"

  run:
    command: "flutter run"
    options:
      persistent: true
      cache: false
      runInCI: false
