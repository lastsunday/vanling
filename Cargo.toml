[workspace]
resolver = '2'
members = [
  'apps/server',
  'libs/macros',
  'libs/build-metadata',
  'libs/framework',
  'libs/framework/macros',
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["lastsunday"]

[workspace.dependencies]
chobits-build-metadata = { package = "chobits_build_metadata", path = "libs/build-metadata", default-features = false }
chobits-macros = { package = "chobits_macros", path = "libs/macros", default-features = false }
chobits-framework-macros = { package = "framework-macros", path = "libs/framework/macros", default-features = false }
clap = "4.6.1"
axum = "0.8.9"
axum-extra = "0.12.6"
tokio = "1.52.3"
# log start
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
color-eyre = "0.6.5"
tracing-appender = "0.2.5"
tracing-error = "0.2.1"
tracing-core = "0.1.36"
# log end
strum = "0.28.0"
strum_macros = "0.28.0"
toml = "1.1.2"
syn = "2.0.118"
quote = "1.0.46"
proc-macro2 = "1.0.106"
itertools = "0.15.0"
core_affinity = "0.8.3"
# config start
config = "0.15.25"
figment = "0.10.19"
either = "1.16.0"
# config end
serde = "1.0.228"
serde_yaml = "0.9.34"
anyhow = "1.0.103"
sea-orm = "2.0.0-rc.40"
sea-orm-migration = "2.0.0-rc.40"
thiserror = "2.0.18"
tower-http = "0.7.0"
tower-layer = "0.3.3"
xid = "1.1.1"
bytesize = "2.4.2"
validator = "0.20.0"
axum-valid = "0.25.0"
regex = "1.13.0"
bcrypt = "0.19.2"
jsonwebtoken = "10.4.0"
utoipa = "5.5.0"
utoipa-axum = "0.2.0"
utoipa-scalar = "0.3.0"
serde_json = "1.0.150"
serde-aux = "4.7.0"
http-body-util = "0.1.3"
mime = "0.3.17"
chrono = "0.4.45"
testcontainers = "0.27.3"
testcontainers-modules = "0.15.0"
rust-i18n = "4.1.0"
futures-util = "0.3.32"
futures-channel = "0.3.32"
jiff = "0.2.32"
ropus = "0.12.18"
ogg = "0.9.2"
tokio-stream = "0.1.18"
tokio-util = "0.7.18"
futures = "0.3.32"
async-trait = "0.1.89"
parking_lot = "0.12.5"
backtrace = "0.3.76"
arrayvec = "0.7.8"
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
sentry = "0.48.4"
sentry-tracing = "0.48.4"
opentelemetry = "0.32.0"
opentelemetry-otlp = "0.32.0"
opentelemetry_sdk = "0.32.1"
tracing-opentelemetry = "0.33.0"
tracing-flame = "0.2.0"
tracing-journald = "0.3.2"
console-subscriber = "0.5.0"
uuid = "1.23.4"
async-std = "1.13.2"
num_cpus = "1.17.0"
rust-embed = "8.12.0"
# audio start
symphonia = "0.6.0"
wavers = "1.5.1"
rubato = "3.0.0"
ebur128 = "0.1.10"
# audio end
# llm start
candle-core = "0.11.0"
candle-transformers = "0.11.0"
candle-nn = "0.11.0"
tokenizers = "0.23.1"
fancy-regex = "0.18.0"
intel-mkl-src = "0.8.1"
accelerate-src = "0.3.2"
rig-core = "0.39.0"
bindgen_cuda = "=0.1.5"
# llm end
# vad start
earshot = "1.1.0"
# vad end
# tts + asr start
sherpa-onnx = "1.13.3"
# tts + asr end
# mcp start
rmcp = "2.2.0"
sse-stream = "0.2.4"
# mcp end
# matrix start
ruma = "0.16.0"
ruma-client = "0.19.0"
# matrix end
tracing-test = "0.2.6"
# download start
reqwest = { version = "0.13.4", default-features = false }
include_dir = "0.7.4"
sha2 = "0.11.0"
hex = "0.4.3"
dialoguer = "0.12.0"
indicatif = "0.18.6"
tar = "0.4.46"
bzip2 = "0.6.1"
# download end
# build start
built = "0.8.1"
# build end
# dev start
tower = "0.5.3"
cucumber = "0.23.0"
mockito = "1.7.2"
# dev end

[profile.dev]
strip = "debuginfo"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
strip = true
debug = false
