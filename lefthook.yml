pre-commit:
  commands:
    fmt:
      glob: "apps/server/**/*.rs"
      run: cargo fmt --check
    clippy:
      glob: "apps/server/**/*.rs"
      run: cargo clippy -- -D warnings
    iot-fmt:
      glob: "**/*.rs"
      root: apps/iot/
      run: cargo fmt --check
    iot-clippy:
      glob: "**/*.rs"
      root: apps/iot/
      # `iot-tool` is host-side and a bare-metal target has no std; a second
      # host tool goes here too. Why not a feature: records/iot/playback.md.
      run: cargo clippy --workspace --exclude iot-tool --target riscv32imac-unknown-none-elf -- -D warnings
    iot-clippy-host:
      glob: "crates/core/**/*.rs"
      root: apps/iot/
      run: cargo clippy -p iot-core --all-targets -- -D warnings
    dart-format:
      glob: "apps/app/**/*.dart"
      run: dart format --set-exit-if-changed .
    flutter-analyze:
      glob: "apps/app/**/*.dart"
      run: flutter analyze

post-checkout:
  commands:
    sweep:
      run: which cargo-sweep && cargo sweep --maxsize 20GB || true

commit-msg:
  commands:
    conventional-commit:
      run: |
        commit_file={1}
        summary=$(head -1 "$commit_file")
        if ! echo "$summary" | grep -qE '^(feat|fix|build|chore|ci|docs|perf|refactor|remove|deprecate|revert|security|style|test|bump)(\([^)]+\))?!?: .+$'; then
          echo ""
          echo "  !! Commit message must follow Conventional Commits v1.0.0:"
          echo "     <type>[optional scope]: <description>"
          echo ""
          echo "     Types: feat, fix, build, chore, ci, docs, perf,"
          echo "            refactor, remove, deprecate, revert, security,"
          echo "            style, test"
          echo ""
          echo "     Examples:"
          echo "       feat: add login page"
          echo "       fix(auth): handle token expiry"
          echo "       feat(api)!: change response format"
          echo "       docs: correct spelling"
          echo ""
          exit 1
        fi
        if grep -qE '^(BREAKING CHANGE|BREAKING-CHANGE|CHANGELOG):[^ ]' "$commit_file"; then
          echo ""
          echo "  !! Footer format error: missing space after ':'"
          echo "     Use: BREAKING CHANGE: <description>"
          echo "          BREAKING-CHANGE: <description>"
          echo "          CHANGELOG: <description>"
          echo ""
          grep -nE '^(BREAKING CHANGE|BREAKING-CHANGE|CHANGELOG):[^ ]' "$commit_file"
          echo ""
          exit 1
        fi
        if grep -qE '^(BREAKING CHANGE|BREAKING-CHANGE|CHANGELOG):\s*$' "$commit_file"; then
          echo ""
          echo "  !! Footer missing description"
          echo "     Use: BREAKING CHANGE: <description>"
          echo "          BREAKING-CHANGE: <description>"
          echo "          CHANGELOG: <description>"
          echo ""
          grep -nE '^(BREAKING CHANGE|BREAKING-CHANGE|CHANGELOG):\s*$' "$commit_file"
          echo ""
          exit 1
        fi
