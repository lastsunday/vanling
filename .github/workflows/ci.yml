name: ci
run-name: ${{ github.actor }} CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to run against
        default: dev
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  merge_group:
    branches: [dev]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - uses: ./.github/actions/free-disk-space

      - uses: ./.github/actions/setup-nix

      - name: Cache model files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: models-${{ hashFiles('apps/server/src/downloader/manifests/**') }}
          restore-keys: |
            models-

      - name: Restore Xtensa Rust toolchain
        id: xtensa-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/esp
            ~/export-esp.sh
          key: iot-esp-${{ runner.os }}-${{ hashFiles('**/flake.nix') }}
          restore-keys: |
            iot-esp-${{ runner.os }}-

      - name: Install Xtensa Rust toolchain
        if: steps.xtensa-cache.outputs.cache-hit != 'true'
        run: >
          nix develop
          --ignore-env
          -k HOME
          -k ACTIONS_CACHE_URL
          -k ACTIONS_RUNTIME_TOKEN
          -k GITHUB_TOKEN
          --command espup install --name esp -v 1.95.0.0

      - name: Verify lockfiles are in sync
        run: >
          nix develop
          --ignore-env
          -k HOME
          --command bash -c 'cargo metadata --locked --format-version 1 > /dev/null &&
          cd apps/iot && cargo metadata --locked --format-version 1 > /dev/null'

      - name: Moon CI pipeline (affected)
        run: >
          nix develop
          --ignore-env
          -k HOME
          -k CARGO_ESP_TARGET
          -k ACTIONS_CACHE_URL
          -k ACTIONS_RUNTIME_TOKEN
          -k GITHUB_TOKEN
          -k MOON_LOG
          -k MOON_OUTPUT_STYLE
          --command moon ci --base=${{ github.event.before || format('origin/{0}', github.base_ref || 'dev') }}
        env:
          CARGO_ESP_TARGET: riscv32imac-unknown-none-elf
          MOON_OUTPUT_STYLE: buffer-only-failure
          MOON_LOG: error

      - uses: moonrepo/run-report-action@bbe7e99bf2aca819ec660ec01fc59d84bdd492d6 # v1.10.0
        if: success() || failure()
        with:
          access-token: ${{ secrets.GITHUB_TOKEN }}

  docs-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref || github.ref }}

      - uses: ./.github/actions/setup-nix

      - name: Check translations
        run: >
          nix develop
          --ignore-env
          -k HOME
          -k ACTIONS_CACHE_URL
          -k ACTIONS_RUNTIME_TOKEN
          --command moon run docs:check-translation
        env:
          MOON_OUTPUT_STYLE: buffer-only-failure
          MOON_LOG: error

  docs-deploy:
    if: github.event_name != 'pull_request'
    needs: [ci, docs-check]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref || github.ref }}

      - uses: ./.github/actions/setup-nix

      - name: Build docs
        run: >
          nix develop
          --ignore-env
          -k HOME
          -k ACTIONS_CACHE_URL
          -k ACTIONS_RUNTIME_TOKEN
          --command moon run docs:build-gh
        env:
          MOON_OUTPUT_STYLE: buffer-only-failure
          MOON_LOG: error

      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/public-gh
          publish_branch: gh-pages
          force_orphan: true
