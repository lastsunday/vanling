name: ci
run-name: ${{ github.actor }} CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to run against
        default: dev
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  merge_group:
    branches: [dev]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - uses: ./.github/actions/free-disk-space

      - uses: ./.github/actions/setup-nix

      - name: Cache model files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: data
          key: models-${{ hashFiles('apps/server/src/downloader/manifests/**') }}
          restore-keys: |
            models-

      - name: Moon CI pipeline (affected)
        run: >
          nix develop
          --ignore-env
          -k CARGO_BUILD_RUSTC_WRAPPER
          -k SCCACHE_GHA_ENABLED
          -k ACTIONS_CACHE_URL
          -k ACTIONS_RUNTIME_TOKEN
          --command moon ci --base=${{ github.event.before || format('origin/{0}', github.base_ref || 'dev') }}
        env:
          MOON_OUTPUT_STYLE: buffer-only-failure
          MOON_LOG: error

      - uses: moonrepo/run-report-action@bbe7e99bf2aca819ec660ec01fc59d84bdd492d6
        if: success() || failure()
        with:
          access-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if extension e2e reports exist
        id: e2e-report
        if: ${{ !cancelled() }}
        run: |
          if [ -d "apps/extension/allure-results" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          fi

      - name: (allure-report) Load test report history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        if: ${{ steps.e2e-report.outputs.exists == 'true' && !cancelled() }}
        continue-on-error: true
        with:
          ref: gh-test
          path: gh-test
          fetch-depth: 1

      - name: (allure-report) Build test report
        uses: simple-elf/allure-report-action@e463a472d3b1d750f9544369d60589ff1964c820
        if: ${{ steps.e2e-report.outputs.exists == 'true' && !cancelled() }}
        with:
          gh_pages: gh-test
          allure_history: gh-test
          allure_results: apps/extension/allure-results

      - name: (allure-report) Upload test report to action artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ steps.e2e-report.outputs.exists == 'true' && !cancelled() }}
        with:
          name: extension-e2e-tests-allure-report
          path: allure-report/
          retention-days: 30

      - name: (cucumber-report) Upload test report to action artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ steps.e2e-report.outputs.exists == 'true' && !cancelled() }}
        with:
          name: extension-e2e-tests-cucumber-report
          path: apps/extension/cucumber-report/
          retention-days: 30

  docs-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref || github.ref }}

      - uses: ./.github/actions/setup-nix

      - name: Check translations
        run: >
          nix develop
          --ignore-env
          -k CARGO_BUILD_RUSTC_WRAPPER
          -k SCCACHE_GHA_ENABLED
          -k ACTIONS_CACHE_URL
          -k ACTIONS_RUNTIME_TOKEN
          --command moon run docs:check-translation
        env:
          MOON_OUTPUT_STYLE: buffer-only-failure
          MOON_LOG: error

  docs-deploy:
    if: github.event_name != 'pull_request'
    needs: [ci, docs-check]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref || github.ref }}

      - uses: ./.github/actions/setup-nix

      - name: Build docs
        run: >
          nix develop
          --ignore-env
          -k CARGO_BUILD_RUSTC_WRAPPER
          -k SCCACHE_GHA_ENABLED
          -k ACTIONS_CACHE_URL
          -k ACTIONS_RUNTIME_TOKEN
          --command moon run docs:build-gh
        env:
          MOON_OUTPUT_STYLE: buffer-only-failure
          MOON_LOG: error

      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/public-gh
          publish_branch: gh-pages
          force_orphan: true
