name: iot-build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
        description: "Version string for artifacts"
      prerelease:
        required: false
        type: boolean
        default: false
        description: "Create a GitHub Pre-release instead of Release"
      dry-run:
        required: false
        type: boolean
        default: false
        description: "Skip GitHub release"
      tag-name:
        required: false
        type: string
        default: ""
        description: "Git tag for the release (defaults to GITHUB_REF_NAME)"
      platforms:
        required: false
        type: string
        default: ""
        description: >
          JSON array of platform specs; each is
          {"chip","target","use-xtensa-toolchain","boards":[...]}.
          Empty falls back to all supported boards (esp32c6 + esp32s3).

env:
  CARGO_TERM_COLOR: always
  ARTIFACT_PREFIX: vanling-iot

jobs:
  matrix-prepare:
    runs-on: ubuntu-latest
    env:
      PLATFORMS_DEFAULT: >-
        [{"chip":"esp32c6","target":"riscv32imac-unknown-none-elf","use-xtensa-toolchain":false,"boards":["esp32c6-devkitc-1"]},{"chip":"esp32s3","target":"xtensa-esp32s3-none-elf","use-xtensa-toolchain":true,"boards":["lckfb-szpi-esp32s3"]}]
    outputs:
      matrix: ${{ steps.flatten.outputs.matrix }}
      platforms: ${{ steps.flatten.outputs.platforms }}
    steps:
      - id: flatten
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          PLATFORMS="${PLATFORMS:-}"
          [ -z "$PLATFORMS" ] && PLATFORMS="$PLATFORMS_DEFAULT"
          printf '%s' "$PLATFORMS" | jq -e 'type == "array" and length > 0' >/dev/null
          echo "platforms=$(printf '%s' "$PLATFORMS" | jq -c .)" >> "$GITHUB_OUTPUT"
          MATRIX=$(printf '%s' "$PLATFORMS" | jq -c '[.[] as $p | $p.boards[] | {board: ., target: $p.target, chip: $p.chip, use_xtensa_toolchain: ($p["use-xtensa-toolchain"] // false)}]')
          [ "$MATRIX" != "[]" ] || { echo "::error::platforms contains no boards"; exit 1; }
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix-prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix-prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-nix

      - name: Install Xtensa Rust toolchain
        if: matrix.use_xtensa_toolchain
        run: >
          nix develop
          --ignore-env
          -k HOME
          -k SCCACHE_GHA_ENABLED
          -k ACTIONS_CACHE_URL
          -k ACTIONS_RUNTIME_TOKEN
          -k GITHUB_TOKEN
          --command espup install --name esp -v 1.95.0.0

      - name: Check IoT workspace (default board)
        run: >
          nix develop
          --ignore-env
          -k HOME
          -k CARGO_BUILD_RUSTC_WRAPPER
          -k SCCACHE_GHA_ENABLED
          -k ACTIONS_CACHE_URL
          -k ACTIONS_RUNTIME_TOKEN
          --command moon run iot:check iot:lint iot:lint-smoke iot:smoke-host
        env:
          MOON_OUTPUT_STYLE: buffer-only-failure
          MOON_LOG: error

      - name: Build firmware for ${{ matrix.board }}
        if: ${{ !matrix.use_xtensa_toolchain }}
        run: >
          nix develop
          --ignore-env
          -k HOME
          -k CARGO_BUILD_RUSTC_WRAPPER
          -k SCCACHE_GHA_ENABLED
          -k ACTIONS_CACHE_URL
          -k ACTIONS_RUNTIME_TOKEN
          --command moon run iot:build
          -- --no-default-features --features ${{ matrix.board }},console-auto
        env:
          MOON_OUTPUT_STYLE: buffer-only-failure
          MOON_LOG: error

      - name: Build firmware for ${{ matrix.board }} (espup native toolchain)
        if: matrix.use_xtensa_toolchain
        run: >
          nix develop
          --ignore-env
          -k HOME
          -k CARGO_BUILD_RUSTC_WRAPPER
          -k SCCACHE_GHA_ENABLED
          -k ACTIONS_CACHE_URL
          -k ACTIONS_RUNTIME_TOKEN
          --command moon run iot:build-s3
        env:
          MOON_OUTPUT_STYLE: buffer-only-failure
          MOON_LOG: error

      - name: Rename firmware for artifact
        run: |
          cp apps/iot/target/${{ matrix.target }}/release/vanling \
             "${{ env.ARTIFACT_PREFIX }}-${{ matrix.board }}-${{ inputs.version }}-${{ matrix.target }}.elf"

      - name: Generate merged image for ${{ matrix.board }}
        run: >
          nix develop
          --ignore-env
          -k HOME
          -k CARGO_BUILD_RUSTC_WRAPPER
          -k SCCACHE_GHA_ENABLED
          -k ACTIONS_CACHE_URL
          -k ACTIONS_RUNTIME_TOKEN
          --command espflash save-image
          --chip ${{ matrix.chip }}
          --merge
          "${{ env.ARTIFACT_PREFIX }}-${{ matrix.board }}-${{ inputs.version }}-${{ matrix.target }}.elf"
          "${{ env.ARTIFACT_PREFIX }}-${{ matrix.board }}-${{ inputs.version }}-merged.bin"

      - name: Emulator smoke for ${{ matrix.board }}
        if: ${{ matrix.board == 'esp32c6-devkitc-1' }}
        run: >
          nix develop
          --ignore-env
          -k HOME
          -k CARGO_BUILD_RUSTC_WRAPPER
          -k SCCACHE_GHA_ENABLED
          -k ACTIONS_CACHE_URL
          -k ACTIONS_RUNTIME_TOKEN
          --command moon run iot:emu-smoke
        env:
          MOON_OUTPUT_STYLE: buffer-only-failure
          MOON_LOG: error

      - name: Upload firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-${{ matrix.board }}-${{ inputs.version }}
          path: |
            ${{ env.ARTIFACT_PREFIX }}-${{ matrix.board }}-${{ inputs.version }}-${{ matrix.target }}.elf
            ${{ env.ARTIFACT_PREFIX }}-${{ matrix.board }}-${{ inputs.version }}-merged.bin
          retention-days: 7

  create-release:
    needs: [build, matrix-prepare]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Prepare release body
        env:
          PLATFORMS: ${{ needs.matrix-prepare.outputs.platforms }}
        run: |
          {
            echo "Firmware for boards:"
            printf '%s' "$PLATFORMS" | jq -r '.[] as $p | $p.boards[] as $b |
              "- `esptool.py write_flash 0x0 vanling-iot-\($b)-${{ inputs.version }}-merged.bin` (merged image)",
              "- `espflash flash vanling-iot-\($b)-${{ inputs.version }}-\($p.target).elf`"'
            echo ""
            echo "Run number: ${GITHUB_RUN_NUMBER}"
            echo "Version: ${{ inputs.version }}"
          } > /tmp/RELEASE_BODY.md

      - name: Download firmware
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ${{ env.ARTIFACT_PREFIX }}-*
          merge-multiple: true

      - name: Clean up existing release for this tag
        run: |
          TAG="${{ inputs.tag-name || github.ref_name }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" 2>/dev/null || true

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          token: ${{ github.token }}
          body_path: /tmp/RELEASE_BODY.md
          prerelease: ${{ inputs.prerelease }}
          make_latest: false
          tag_name: ${{ inputs.tag-name || github.ref_name }}
          name: ${{ inputs.tag-name || github.ref_name }}
          files: ${{ env.ARTIFACT_PREFIX }}-*