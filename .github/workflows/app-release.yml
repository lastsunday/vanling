name: app-release
run-name: ${{ github.actor }} app release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Skip GitHub release creation
        type: boolean
        default: false
  push:
    tags:
      - "vanling-app@*"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.VERSION }}
    steps:
      - name: Set VERSION
        id: set-version
        run: echo "VERSION=${GITHUB_REF_NAME#vanling-app@}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/reusable-app-build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      dry-run: ${{ inputs.dry-run || false }}
    secrets: inherit
