name: app-dev-release
run-name: ${{ github.actor }} app dev build

permissions:
  contents: write

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [dev]

concurrency:
  group: app-dev-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      dev-version: ${{ steps.gen.outputs.DEV_VERSION }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 2
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          base: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          filters: |
            app:
              - 'apps/app/**'

      - id: gen
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.filter.outputs.app == 'true'
        run: |
          dev_version=$(bash scripts/version.sh apps/app/pubspec.yaml)
          echo "DEV_VERSION=$dev_version" >> "$GITHUB_ENV"
          echo "DEV_VERSION=$dev_version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.dev-version != ''
    uses: ./.github/workflows/reusable-app-build.yml
    with:
      version: ${{ needs.prepare.outputs.dev-version }}
      prerelease: true
      tag-name: dev-app-${{ github.run_number }}
    secrets: inherit

  cleanup:
    needs: [prepare, build]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    uses: ./.github/workflows/reusable-dev-release-cleanup.yml
    with:
      tag-prefix: dev-app-
    secrets: inherit
