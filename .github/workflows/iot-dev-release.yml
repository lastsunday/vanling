name: iot-dev-release
run-name: ${{ github.actor }} iot dev build

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: >-
          JSON array of platform specs. Each: {"chip","target",
          "use-xtensa-toolchain","boards":[...]}. Empty = all boards
          (esp32c6-devkitc-1 + lckfb-szpi-esp32s3).
        type: string
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [dev]

concurrency:
  group: iot-dev-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      dev-version: ${{ steps.gen.outputs.DEV_VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          filters: |
            iot:
              - 'apps/iot/**'

      - id: gen
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.filter.outputs.iot == 'true'
        run: |
          dev_version=$(bash scripts/version.sh apps/iot/Cargo.toml)
          echo "DEV_VERSION=$dev_version" >> "$GITHUB_ENV"
          echo "DEV_VERSION=$dev_version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.dev-version != ''
    uses: ./.github/workflows/reusable-iot-build.yml
    with:
      version: ${{ needs.prepare.outputs.dev-version }}
      prerelease: true
      tag-name: dev-iot-${{ github.run_number }}
      platforms: ${{ inputs.platforms }}
    secrets: inherit

  cleanup:
    needs: [prepare, build]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    uses: ./.github/workflows/reusable-dev-release-cleanup.yml
    with:
      tag-prefix: dev-iot-
    secrets: inherit