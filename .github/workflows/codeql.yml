name: codeql
run-name: ${{ github.actor }} CodeQL analysis

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches:
      - dev
    paths:
      - "apps/server/**"
      - "libs/**"
      - ".github/**"
  pull_request:
    branches:
      - dev
    paths:
      - "apps/server/**"
      - "libs/**"
      - ".github/**"
  merge_group:
    branches:
      - dev

jobs:
  analyze:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - rust

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1

      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      # Free disk space must run BEFORE Initialize CodeQL,
      # otherwise it deletes the freshly installed CodeQL binary.
      - name: Free Disk Space
        if: matrix.language == 'rust'
        uses: ./.github/actions/free-disk-space

      - name: Setup Nix
        if: matrix.language == 'rust'
        uses: ./.github/actions/setup-nix

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: ${{ matrix.language }}

      # vanling-server excluded: requires SHERPA_ONNX_LIB_DIR (sherpa-onnx prebuilt libs)
      # only available via Nix buildRustPackage, not the devShell
      - name: Build Rust
        if: matrix.language == 'rust'
        run: nix develop --command cargo build --workspace --exclude vanling-server --verbose

      - name: Autobuild
        uses: github/codeql-action/autobuild@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        if: matrix.language != 'rust'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
