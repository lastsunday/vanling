name: codeql
run-name: ${{ github.actor }} CodeQL analysis

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches:
      - dev
    paths:
      - "apps/server/**"
      - "libs/**"
      - ".github/**"
  pull_request:
    branches:
      - dev
    paths:
      - "apps/server/**"
      - "libs/**"
      - ".github/**"
  merge_group:
    branches:
      - dev

jobs:
  analyze:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - rust

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: ${{ matrix.language }}

      - name: Install Nix
        if: matrix.language == 'rust'
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Cache Nix store
        if: matrix.language == 'rust'
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d
        continue-on-error: true

      - name: Build Rust
        if: matrix.language == 'rust'
        run: nix develop --command cargo build --workspace --exclude chobits-server --exclude web --verbose

      - name: Autobuild
        uses: github/codeql-action/autobuild@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        if: matrix.language != 'rust'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
