name: server-build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
        description: "Version string for artifacts and Docker tags"
      prerelease:
        required: false
        type: boolean
        default: false
        description: "Create a GitHub Pre-release instead of Release"
      dry-run:
        required: false
        type: boolean
        default: false
        description: "Skip Docker push and GitHub release"
      tag-name:
        required: false
        type: string
        default: ""
        description: "Git tag for the release (defaults to GITHUB_REF_NAME)"

env:
  CARGO_TERM_COLOR: always
  ROOT_DIR: apps/server/
  REGISTRY: ghcr.io
  USER_NAME: lastsunday
  IMAGE_NAME: chobits
  BIN_NAME: chobits-server
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25
        with:
          extra-conf: |
            accept-flake-config = true

      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d
        continue-on-error: true

      - name: Build UI
        run: >
          nix develop
          --ignore-env
          -k CARGO_BUILD_RUSTC_WRAPPER
          -k SCCACHE_GHA_ENABLED
          -k ACTIONS_CACHE_URL
          -k ACTIONS_RUNTIME_TOKEN
          --command moon run server-ui:build

      - name: Upload UI dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: server-ui-dist
          path: apps/server-ui/dist
          retention-days: 1

  build-assets:
    needs: build-ui
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.ROOT_DIR }}
    env:
      CFLAGS: ${{ contains(matrix.target, 'musl') && '-fno-stack-protector' || '' }}
      CFLAGS_X86_64_UNKNOWN_LINUX_MUSL: -fno-stack-protector
      CFLAGS_AARCH64_UNKNOWN_LINUX_MUSL: -fno-stack-protector
      OPUS_NO_PKG: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            targetOSAndARCH: linux-arm64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            targetOSAndARCH: linux-amd64
          - target: universal-apple-darwin
            os: macos-latest
            targetOSAndARCH: macos
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            targetOSAndARCH: window-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1

      - name: Download UI dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: server-ui-dist
          path: apps/server-ui/dist

      - uses: ./.github/actions/free-disk-space
        if: runner.os == 'Linux'

      - name: Setup Perl (Windows only)
        uses: shogo82148/actions-setup-perl@a198315ec4e9244f206879ea7b63078003aec8a6
        if: contains(matrix.os, 'windows')
        with:
          perl-version: "5.38"
          distribution: strawberry

      - name: Set Perl environment variables (Windows only)
        shell: powershell
        working-directory: \
        if: runner.os == 'Windows'
        run: |
          echo "PERL=$((where.exe perl)[0])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "OPENSSL_SRC_PERL=$((where.exe perl)[0])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Nix (Linux / macOS)
        if: runner.os != 'Windows'
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Cache Nix store (Linux / macOS)
        if: runner.os != 'Windows'
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d
        continue-on-error: true

      - name: Setup sccache (Linux / macOS)
        if: runner.os != 'Windows'
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696

      - name: Move UI dist to web/ (Windows)
        if: runner.os == 'Windows'
        run: |
          rm -rf ./web/dist
          mv ../server-ui/dist ./web/dist

      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6
        with:
          bin: ${{ env.BIN_NAME }}
          archive: ${{ env.BIN_NAME }}-${{ inputs.version }}-${{ matrix.target }}
          target: ${{ matrix.target }}
          dry-run: true
          manifest-path: Cargo.toml
          features: vendored-openssl

      - name: Rename bin for artifact
        shell: bash
        run: |
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          src="${{ github.workspace }}/target/${{ matrix.target }}/release/${{ env.BIN_NAME }}$ext"
          dst="${{ github.workspace }}/target/${{ matrix.target }}/release/${{ env.BIN_NAME }}-${{ matrix.targetOSAndARCH }}$ext"
          mv "$src" "$dst"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.BIN_NAME }}-${{ inputs.version }}-${{ matrix.targetOSAndARCH }}
          path: ${{ github.workspace }}/target/${{ matrix.target }}/release/${{ env.BIN_NAME }}-${{ matrix.targetOSAndARCH }}*
          retention-days: 7

  create-release:
    needs: build-assets
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        if: ${{ !inputs.prerelease }}
        with:
          fetch-depth: 1

      - uses: ./.github/actions/extract-changelog
        if: ${{ !inputs.prerelease }}
        with:
          changelog-path: ${{ env.ROOT_DIR }}CHANGELOG.md
          output-path: /tmp/RELEASE_BODY.md

      - name: Prepare generic body
        if: ${{ inputs.prerelease }}
        run: |
          {
            echo "Dev build from \`${GITHUB_SHA:0:7}\`"
            echo ""
            echo "Run number: ${GITHUB_RUN_NUMBER}"
            echo "Date: $(date -u +%Y%m%d)"
            echo "Version: ${{ inputs.version }}"
          } > /tmp/RELEASE_BODY.md

      - name: Download all binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: release-binaries
          pattern: ${{ env.BIN_NAME }}-${{ inputs.version }}-*
          merge-multiple: true

      - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          token: ${{ github.token }}
          body_path: /tmp/RELEASE_BODY.md
          prerelease: ${{ inputs.prerelease }}
          make_latest: false
          tag_name: ${{ inputs.tag-name || github.ref_name }}
          name: ${{ inputs.tag-name || github.ref_name }}
          files: release-binaries/*


  push-docker:
    needs: build-assets
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.ROOT_DIR }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: ${{ env.IMAGE_NAME }}
          pattern: ${{ env.BIN_NAME }}-${{ inputs.version }}-linux-*
          merge-multiple: true

      - name: Move & chmod
        run: |
          mv ${{ github.workspace }}/${{ env.IMAGE_NAME }}/* ./
          chmod 755 ${{ env.BIN_NAME }}-*

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Login to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to ghcr.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: |
            ${{ env.USER_NAME }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ env.USER_NAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.version }},enable=${{ !inputs.prerelease }}
            type=raw,value=dev,enable=${{ inputs.prerelease }}
            type=raw,value=dev-${{ inputs.version }},enable=${{ inputs.prerelease }}
          flavor: |
            latest=${{ !inputs.prerelease }}

      - name: Build and push Docker images
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ${{ env.ROOT_DIR }}
          platforms: linux/amd64,linux/arm64
          push: ${{ !inputs.dry-run }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        if: ${{ !inputs.dry-run }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.USER_NAME }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
