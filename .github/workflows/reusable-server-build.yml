name: server-build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
        description: "Version string for artifacts and Docker tags"
      prerelease:
        required: false
        type: boolean
        default: false
        description: "Create a GitHub Pre-release instead of Release"
      dry-run:
        required: false
        type: boolean
        default: false
        description: "Skip Docker push and GitHub release"
      tag-name:
        required: false
        type: string
        default: ""
        description: "Git tag for the release (defaults to GITHUB_REF_NAME)"

env:
  CARGO_TERM_COLOR: always
  ROOT_DIR: apps/server/
  REGISTRY: ghcr.io
  USER_NAME: lastsunday
  IMAGE_NAME: chobits
  BIN_NAME: chobits-server

jobs:
  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-nix
        with:
          cache: false

      - name: Build UI
        run: >
          nix develop
          --ignore-env
          -k CARGO_BUILD_RUSTC_WRAPPER
          -k SCCACHE_GHA_ENABLED
          -k ACTIONS_CACHE_URL
          -k ACTIONS_RUNTIME_TOKEN
          --command moon run server-ui:build
        env:
          MOON_OUTPUT_STYLE: buffer-only-failure
          MOON_LOG: error

      - name: Upload UI dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: server-ui-dist
          path: apps/server-ui/dist
          retention-days: 1

  build-linux:
    needs: build-ui
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.ROOT_DIR }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            targetOSAndARCH: linux-arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            targetOSAndARCH: linux-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1

      - name: Download UI dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: server-ui-dist
          path: apps/server-ui/dist

      - uses: ./.github/actions/free-disk-space

      - name: Install Nix
        uses: ./.github/actions/setup-nix

      - name: Build with Nix
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            nix build .#chobits-server-arm64 --quiet --no-print-build-logs
          else
            nix build .#chobits-server --quiet --no-print-build-logs
          fi

      - name: Copy binary from Nix store
        shell: bash
        run: |
          src="result/bin/${{ env.BIN_NAME }}"
          dst="${{ github.workspace }}/target/${{ matrix.target }}/release/${{ env.BIN_NAME }}-${{ matrix.targetOSAndARCH }}"
          mkdir -p "$(dirname "$dst")"
          cp "$src" "$dst"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.BIN_NAME }}-${{ inputs.version }}-${{ matrix.targetOSAndARCH }}
          path: ${{ github.workspace }}/target/${{ matrix.target }}/release/${{ env.BIN_NAME }}-${{ matrix.targetOSAndARCH }}*
          retention-days: 7

  build-other:
    needs: build-ui
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.ROOT_DIR }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: universal-apple-darwin
            os: macos-latest
            targetOSAndARCH: macos
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            targetOSAndARCH: window-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Download UI dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: server-ui-dist
          path: apps/server-ui/dist

      - name: Setup Perl (Windows only)
        uses: shogo82148/actions-setup-perl@a198315ec4e9244f206879ea7b63078003aec8a6
        if: contains(matrix.os, 'windows')
        with:
          perl-version: "5.38"
          distribution: strawberry

      - name: Set Perl environment variables (Windows only)
        shell: powershell
        working-directory: \
        if: runner.os == 'Windows'
        run: |
          echo "PERL=$((where.exe perl)[0])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "OPENSSL_SRC_PERL=$((where.exe perl)[0])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Nix (macOS)
        if: runner.os != 'Windows'
        uses: ./.github/actions/setup-nix

      - name: Setup sccache (macOS)
        if: runner.os != 'Windows'
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696

      - name: Move UI dist to web/ (Windows)
        if: runner.os == 'Windows'
        run: |
          rm -rf ./web/dist
          mv ../server-ui/dist ./web/dist

      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6
        with:
          bin: ${{ env.BIN_NAME }}
          archive: ${{ env.BIN_NAME }}-${{ inputs.version }}-${{ matrix.target }}
          target: ${{ matrix.target }}
          dry-run: true
          manifest-path: Cargo.toml

      - name: Rename bin for artifact
        shell: bash
        run: |
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          src="${{ github.workspace }}/target/${{ matrix.target }}/release/${{ env.BIN_NAME }}$ext"
          dst="${{ github.workspace }}/target/${{ matrix.target }}/release/${{ env.BIN_NAME }}-${{ matrix.targetOSAndARCH }}$ext"
          mv "$src" "$dst"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.BIN_NAME }}-${{ inputs.version }}-${{ matrix.targetOSAndARCH }}
          path: ${{ github.workspace }}/target/${{ matrix.target }}/release/${{ env.BIN_NAME }}-${{ matrix.targetOSAndARCH }}*
          retention-days: 7

  create-release:
    needs: [build-linux, build-other]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        if: ${{ !inputs.prerelease }}
        with:
          fetch-depth: 1

      - uses: ./.github/actions/extract-changelog
        if: ${{ !inputs.prerelease }}
        with:
          changelog-path: ${{ env.ROOT_DIR }}CHANGELOG.md
          output-path: /tmp/RELEASE_BODY.md

      - name: Prepare generic body
        if: ${{ inputs.prerelease }}
        run: |
          {
            echo "Dev build from \`${GITHUB_SHA:0:7}\`"
            echo ""
            echo "Run number: ${GITHUB_RUN_NUMBER}"
            echo "Date: $(date -u +%Y%m%d)"
            echo "Version: ${{ inputs.version }}"
          } > /tmp/RELEASE_BODY.md

      - name: Download all binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: release-binaries
          pattern: ${{ env.BIN_NAME }}-${{ inputs.version }}-*
          merge-multiple: true

      - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          token: ${{ github.token }}
          body_path: /tmp/RELEASE_BODY.md
          prerelease: ${{ inputs.prerelease }}
          make_latest: false
          tag_name: ${{ inputs.tag-name || github.ref_name }}
          name: ${{ inputs.tag-name || github.ref_name }}
          files: release-binaries/*


  push-docker:
    needs: build-linux
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1

      - name: Install Nix
        uses: ./.github/actions/setup-nix

      - name: Build Docker image (amd64)
        run: nix build .#docker-amd64 --out-link result-amd64 --quiet --no-print-build-logs

      - name: Build Docker image (arm64)
        run: nix build .#docker-arm64 --out-link result-arm64 --quiet --no-print-build-logs

      - name: Load images
        run: |
          docker load < result-amd64
          docker load < result-arm64

      - name: Download binaries for data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: bins
          pattern: ${{ env.BIN_NAME }}-${{ inputs.version }}-linux-amd64
          merge-multiple: true

      - name: Download models
        run: |
          chmod +x bins/${{ env.BIN_NAME }}-*
          ./bins/${{ env.BIN_NAME }}-* downloader install --all --data-dir ./data --quiet

      - name: Add data layer to images
        run: |
          # amd64
          docker create --name temp-amd64 chobits:dev-amd64
          docker cp ./data temp-amd64:/app/data
          docker cp ./download-report.json temp-amd64:/app/data/ 2>/dev/null || true
          docker commit temp-amd64 chobits:dev-amd64-data
          docker rm temp-amd64

          # arm64
          docker create --name temp-arm64 chobits:dev-arm64
          docker cp ./data temp-arm64:/app/data
          docker cp ./download-report.json temp-arm64:/app/data/ 2>/dev/null || true
          docker commit temp-arm64 chobits:dev-arm64-data
          docker rm temp-arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Login to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to ghcr.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: |
            ${{ env.USER_NAME }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ env.USER_NAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.version }},enable=${{ !inputs.prerelease }}
            type=raw,value=dev,enable=${{ inputs.prerelease }}
            type=raw,value=dev-${{ inputs.version }},enable=${{ inputs.prerelease }}
          flavor: |
            latest=${{ !inputs.prerelease }}

      - name: Create and push manifest
        run: |
          TAGS=$(echo "${{ steps.meta.outputs.tags }}" | tr '\n' ' ')
          for tag in $TAGS; do
            docker tag chobits:dev-amd64-data "$tag-amd64"
            docker push "$tag-amd64"
            docker tag chobits:dev-arm64-data "$tag-arm64"
            docker push "$tag-arm64"

            docker manifest create "$tag" "$tag-amd64" "$tag-arm64"
            docker manifest push "$tag"
          done

      - name: Generate artifact attestation
        if: ${{ !inputs.dry-run }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.USER_NAME }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
