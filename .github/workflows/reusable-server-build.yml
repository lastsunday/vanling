name: server-build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
        description: "Version string for artifacts and Docker tags"
      prerelease:
        required: false
        type: boolean
        default: false
        description: "Create a GitHub Pre-release instead of Release"
      dry-run:
        required: false
        type: boolean
        default: false
        description: "Skip Docker push and GitHub release"
      tag-name:
        required: false
        type: string
        default: ""
        description: "Git tag for the release (defaults to GITHUB_REF_NAME)"

env:
  CARGO_TERM_COLOR: always
  ROOT_DIR: apps/server/
  REGISTRY: ghcr.io
  USER_NAME: lastsunday
  IMAGE_NAME: chobits
  BIN_NAME: chobits-server

jobs:
  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-nix

      - name: Build UI
        run: >
          nix develop
          --ignore-env
          -k CARGO_BUILD_RUSTC_WRAPPER
          -k SCCACHE_GHA_ENABLED
          -k ACTIONS_CACHE_URL
          -k ACTIONS_RUNTIME_TOKEN
          --command moon run server-ui:build
        env:
          MOON_OUTPUT_STYLE: buffer-only-failure
          MOON_LOG: error

      - name: Upload UI dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: server-ui-dist
          path: apps/server-ui/dist
          retention-days: 1

  build-linux:
    needs: build-ui
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.ROOT_DIR }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1

      - name: Download UI dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: server-ui-dist
          path: apps/server-ui/dist

      - uses: ./.github/actions/free-disk-space

      - name: Install Nix
        uses: ./.github/actions/setup-nix

      - name: Cache model files
        uses: actions/cache@v4
        with:
          path: apps/server/data
          key: models-${{ hashFiles('apps/server/src/downloader/manifests/**') }}
          restore-keys: |
            models-

      - name: Build binary (amd64)
        run: nix build .#chobits-server --quiet

      - name: Copy binary (amd64)
        run: |
          mkdir -p "${{ github.workspace }}/target/x86_64-unknown-linux-gnu/release"
          cp result/bin/${{ env.BIN_NAME }} "${{ github.workspace }}/target/x86_64-unknown-linux-gnu/release/${{ env.BIN_NAME }}-linux-amd64"

      - name: Build binary (arm64)
        run: nix build .#chobits-server-arm64 --quiet

      - name: Copy binary (arm64)
        run: |
          mkdir -p "${{ github.workspace }}/target/aarch64-unknown-linux-gnu/release"
          cp result/bin/${{ env.BIN_NAME }} "${{ github.workspace }}/target/aarch64-unknown-linux-gnu/release/${{ env.BIN_NAME }}-linux-arm64"

      - name: Build Docker image (amd64)
        run: nix build .#docker-amd64 --out-link result-amd64 --quiet

      - name: Build Docker image (arm64)
        run: nix build .#docker-arm64 --out-link result-arm64 --quiet

      - name: Upload binary (amd64)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.BIN_NAME }}-${{ inputs.version }}-linux-amd64
          path: ${{ github.workspace }}/target/x86_64-unknown-linux-gnu/release/${{ env.BIN_NAME }}-linux-amd64*
          retention-days: 7

      - name: Upload binary (arm64)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.BIN_NAME }}-${{ inputs.version }}-linux-arm64
          path: ${{ github.workspace }}/target/aarch64-unknown-linux-gnu/release/${{ env.BIN_NAME }}-linux-arm64*
          retention-days: 7

      - name: Load images
        run: |
          docker load < result-amd64
          docker load < result-arm64

      - name: Diagnose binary
        run: |
          echo "=== Binary file info ==="
          file "${{ github.workspace }}/target/x86_64-unknown-linux-gnu/release/${{ env.BIN_NAME }}-linux-amd64"
          echo "=== Dynamic dependencies ==="
          ldd "${{ github.workspace }}/target/x86_64-unknown-linux-gnu/release/${{ env.BIN_NAME }}-linux-amd64" || true
          echo "=== Binary permissions ==="
          ls -la "${{ github.workspace }}/target/x86_64-unknown-linux-gnu/release/${{ env.BIN_NAME }}-linux-amd64"
          echo "=== Disk space ==="
          df -h .

      - name: Download models
        timeout-minutes: 30
        run: |
          chmod +x "${{ github.workspace }}/target/x86_64-unknown-linux-gnu/release/${{ env.BIN_NAME }}-linux-amd64"
          "${{ github.workspace }}/target/x86_64-unknown-linux-gnu/release/${{ env.BIN_NAME }}-linux-amd64" downloader install --all --data-dir ./data || {
            echo "Binary exit code: $?"
            echo "Checking if data directory exists:"
            ls -la ./data || echo "data dir does not exist"
          }

      - name: Verify downloaded models
        run: |
          echo "=== Data directory contents ==="
          find ./data -type f -exec ls -lh {} \; 2>/dev/null || echo "No files found"
          echo "=== Total size ==="
          du -sh ./data 2>/dev/null || echo "Directory empty or not found"

      - name: Add data layer to images
        run: |
          # amd64
          docker create --name temp-amd64 chobits:dev-amd64
          docker cp ./data temp-amd64:/app/data
          docker cp ./download-report.json temp-amd64:/app/data/ 2>/dev/null || true
          docker commit temp-amd64 chobits:dev-amd64-data
          docker rm temp-amd64

          # arm64
          docker create --name temp-arm64 chobits:dev-arm64
          docker cp ./data temp-arm64:/app/data
          docker cp ./download-report.json temp-arm64:/app/data/ 2>/dev/null || true
          docker commit temp-arm64 chobits:dev-arm64-data
          docker rm temp-arm64

      - name: Login to Docker Hub
        if: ${{ !inputs.dry-run }}
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to ghcr.io
        if: ${{ !inputs.dry-run }}
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: ${{ !inputs.dry-run }}
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: |
            ${{ env.USER_NAME }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ env.USER_NAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.version }},enable=${{ !inputs.prerelease }}
            type=raw,value=dev,enable=${{ inputs.prerelease }}
            type=raw,value=dev-${{ inputs.version }},enable=${{ inputs.prerelease }}
          flavor: |
            latest=${{ !inputs.prerelease }}

      - name: Create and push manifest
        id: manifest
        if: ${{ !inputs.dry-run }}
        run: |
          TAGS=$(echo "${{ steps.meta.outputs.tags }}" | tr '\n' ' ')
          for tag in $TAGS; do
            docker tag chobits:dev-amd64-data "$tag-amd64"
            docker push "$tag-amd64"
            docker tag chobits:dev-arm64-data "$tag-arm64"
            docker push "$tag-arm64"

            docker buildx imagetools create -t "$tag" "$tag-amd64" "$tag-arm64" \
              --metadata-file /tmp/metadata.json
          done
          echo "digest=$(jq -r '.["containerimage.descriptor"].digest' /tmp/metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation
        if: ${{ !inputs.dry-run }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.USER_NAME }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  build-other:
    needs: build-ui
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.ROOT_DIR }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: universal-apple-darwin
            os: macos-latest
            targetOSAndARCH: macos
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            targetOSAndARCH: window-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Download UI dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: server-ui-dist
          path: apps/server-ui/dist

      - name: Move UI dist to web/ (Windows)
        if: runner.os == 'Windows'
        run: |
          rm -rf ./web/dist
          mv ../server-ui/dist ./web/dist

      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6
        with:
          bin: ${{ env.BIN_NAME }}
          archive: ${{ env.BIN_NAME }}-${{ inputs.version }}-${{ matrix.target }}
          target: ${{ matrix.target }}
          dry-run: true
          manifest-path: Cargo.toml

      - name: Rename bin for artifact
        shell: bash
        run: |
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          src="${{ github.workspace }}/target/${{ matrix.target }}/release/${{ env.BIN_NAME }}$ext"
          dst="${{ github.workspace }}/target/${{ matrix.target }}/release/${{ env.BIN_NAME }}-${{ matrix.targetOSAndARCH }}$ext"
          mv "$src" "$dst"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.BIN_NAME }}-${{ inputs.version }}-${{ matrix.targetOSAndARCH }}
          path: ${{ github.workspace }}/target/${{ matrix.target }}/release/${{ env.BIN_NAME }}-${{ matrix.targetOSAndARCH }}*
          retention-days: 7

  create-release:
    needs: [build-linux, build-other]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        if: ${{ !inputs.prerelease }}
        with:
          fetch-depth: 1

      - uses: ./.github/actions/extract-changelog
        if: ${{ !inputs.prerelease }}
        with:
          changelog-path: ${{ env.ROOT_DIR }}CHANGELOG.md
          output-path: /tmp/RELEASE_BODY.md

      - name: Prepare generic body
        if: ${{ inputs.prerelease }}
        run: |
          {
            echo "Dev build from \`${GITHUB_SHA:0:7}\`"
            echo ""
            echo "Run number: ${GITHUB_RUN_NUMBER}"
            echo "Date: $(date -u +%Y%m%d)"
            echo "Version: ${{ inputs.version }}"
          } > /tmp/RELEASE_BODY.md

      - name: Download all binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: release-binaries
          pattern: ${{ env.BIN_NAME }}-${{ inputs.version }}-*
          merge-multiple: true

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          token: ${{ github.token }}
          body_path: /tmp/RELEASE_BODY.md
          prerelease: ${{ inputs.prerelease }}
          make_latest: false
          tag_name: ${{ inputs.tag-name || github.ref_name }}
          name: ${{ inputs.tag-name || github.ref_name }}
          files: release-binaries/*
