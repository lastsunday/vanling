name: Free Disk Space
description: Free up disk space on GitHub Actions runners by removing unused toolchains

runs:
  using: composite
  steps:
    - name: Free Disk Space
      uses: endersonmenezes/free-disk-space@8b8cd4e2277836962939a8f3b4ea0ee4bc006156 # v4.0.1
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        rm_cmd: "rmz"
        rmz_version: "3.1.1"
        testing: false
    - name: Show disk usage
      shell: bash
      run: df -h
