name: Setup Nix
description: Install Nix with flake support and optional magic cache

inputs:
  cache:
    description: Enable magic-nix-cache for faster subsequent runs
    default: "true"

runs:
  using: composite
  steps:
    - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25
      with:
        extra-conf: |
          accept-flake-config = true
    - if: inputs.cache == 'true'
      uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d
      continue-on-error: true
